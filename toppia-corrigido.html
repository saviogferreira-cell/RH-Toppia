<style>

:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F2F2F2;
  --ink: #111111;
  --ink-soft: #454545;
  --ink-faint: #8A8A8A;
  --border: #DDDDDD;
  --primary: #000000;
  --primary-ink: #FFFFFF;
  --primary-soft: #ECECEC;
  --ok: #111111;
  --ok-soft: #ECECEC;
  --warn: #A17F00;
  --warn-soft: #FFF3C4;
  --bad: #C81E1E;
  --bad-soft: #FBE0DF;
  --muted: #666666;
  --muted-soft: #F0F0F0;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
  --radius: 8px;
  --font-ui: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) {
    --bg: #0A0A0A; --surface: #151515; --surface-2: #1E1E1E; --ink: #F2F2F2; --ink-soft: #B8B8B8;
    --ink-faint: #7A7A7A; --border: #2C2C2C; --primary: #FFFFFF; --primary-ink: #0A0A0A; --primary-soft: #232323;
    --ok: #F2F2F2; --ok-soft: #232323; --warn: #E8C34A; --warn-soft: #332B0E; --bad: #E2645C; --bad-soft: #2E1614;
    --muted: #9A9A9A; --muted-soft: #1E1E1E; --shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  }
}
:root[data-theme="dark"] {
  --bg: #0A0A0A; --surface: #151515; --surface-2: #1E1E1E; --ink: #F2F2F2; --ink-soft: #B8B8B8;
  --ink-faint: #7A7A7A; --border: #2C2C2C; --primary: #FFFFFF; --primary-ink: #0A0A0A; --primary-soft: #232323;
  --ok: #F2F2F2; --ok-soft: #232323; --warn: #E8C34A; --warn-soft: #332B0E; --bad: #E2645C; --bad-soft: #2E1614;
  --muted: #9A9A9A; --muted-soft: #1E1E1E; --shadow: 0 1px 3px rgba(0,0,0,0.5);
}
:root[data-theme="light"] {
  --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F2F2F2; --ink: #111111; --ink-soft: #454545;
  --ink-faint: #8A8A8A; --border: #DDDDDD; --primary: #000000; --primary-ink: #FFFFFF; --primary-soft: #ECECEC;
  --ok: #111111; --ok-soft: #ECECEC; --warn: #A17F00; --warn-soft: #FFF3C4; --bad: #C81E1E; --bad-soft: #FBE0DF;
  --muted: #666666; --muted-soft: #F0F0F0; --shadow: 0 1px 2px rgba(0,0,0,0.08);
}


* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui);
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-faint); }
a { color: var(--primary); }
h1, h2, h3 { font-weight: 600; letter-spacing: -0.01em; color: var(--ink); margin: 0 0 4px; }
h1 { font-size: 22px; }
h2 { font-size: 15px; margin-bottom: 12px; }
h3 { font-size: 13px; margin-top: 18px; color: var(--ink-soft); }
ul { padding-left: 20px; }
li { margin-bottom: 6px; }
p { margin: 0 0 10px; color: var(--ink-soft); }

.shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 248px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px; border-bottom: 1px solid var(--border); }
.brand-name { font-weight: 700; font-size: 16px; line-height: 1.2; color: var(--ink); letter-spacing: -0.01em; }
.brand-dot { color: var(--ink); }
.brand-sub { font-size: 11px; color: var(--ink-faint); }
.nav { padding: 10px 8px; flex: 1; }
.nav-group { margin-bottom: 14px; }
.nav-group-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); padding: 6px 10px 4px; }
.nav-link {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--ink-soft);
  text-decoration: none; font-size: 13px; margin-bottom: 1px;
}
.nav-link:hover { background: var(--surface-2); }
.nav-link.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.nav-ic { width: 16px; text-align: center; font-size: 13px; opacity: 0.8; }
.sidebar-foot { padding: 12px 16px; font-size: 11px; color: var(--ink-faint); border-top: 1px solid var(--border); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px;
  border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 5;
}
.search-wrap { position: relative; flex: 1; max-width: 480px; }
#global-search {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg);
  color: var(--ink); font-family: var(--font-ui); font-size: 13px;
}
.search-results {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); max-height: 320px; overflow-y: auto; z-index: 20;
}
.search-item { padding: 9px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
.search-item:last-child { border-bottom: none; }
.search-item:hover { background: var(--surface-2); }
.hidden { display: none; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; white-space: normal !important; }
.row-actions .btn { padding: 5px 9px; font-size: 12px; }
.role-switch { display: flex; gap: 8px; }
.role-switch select {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 7px 10px;
  font-family: var(--font-ui); font-size: 12.5px;
}

.content { padding: 24px 28px 60px; max-width: 1240px; }
.page-head { margin-bottom: 20px; }
.breadcrumb { font-size: 12.5px; text-decoration: none; color: var(--ink-faint); display: inline-block; margin-bottom: 6px; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 22px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.kpi-label { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 6px; }
.kpi-value { font-family: var(--font-mono); font-size: 24px; font-weight: 600; }
.kpi-value.ok { color: var(--ok); } .kpi-value.warn { color: var(--warn); } .kpi-value.bad { color: var(--bad); }
.kpi-sub { font-size: 11px; color: var(--ink-faint); margin-top: 4px; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } .sidebar { display: none; } }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.panel-actions { margin-top: 14px; }

.toolbar { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 12px; }
.select-filter {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 8px 12px;
  font-family: var(--font-ui); font-size: 13px;
}
.btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 6px;
  font-family: var(--font-ui); font-size: 13px; cursor: pointer; font-weight: 500;
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { opacity: 0.92; }
.btn-danger { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; padding: 10px 14px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
.table td { padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.table tr:last-child td { border-bottom: none; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: var(--surface-2); }
.table tr.row-highlight td { background: var(--warn-soft); }
.empty-row { text-align: center; color: var(--ink-faint); padding: 24px; }
.empty { padding: 40px; text-align: center; color: var(--ink-faint); }

.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-bad { background: var(--bad-soft); color: var(--bad); }
.badge-muted { background: var(--muted-soft); color: var(--muted); }

.deflist { display: grid; grid-template-columns: 140px 1fr; row-gap: 8px; column-gap: 10px; margin: 0; }
.deflist dt { color: var(--ink-faint); font-size: 12.5px; }
.deflist dd { margin: 0; font-size: 13px; }

.indicator { margin-bottom: 16px; }
.indicator-top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
.indicator-meta { font-size: 11px; color: var(--ink-faint); margin-top: 4px; }
.bar { height: 6px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; }
.bar-ok { background: var(--ok); } .bar-warn { background: var(--warn); } .bar-bad { background: var(--bad); }

.modal-backdrop { position: fixed; inset: 0; background: rgba(5, 3, 10, 0.65); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.modal { background: var(--surface); border-radius: 10px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-close { border: none; background: none; font-size: 15px; cursor: pointer; color: var(--ink-faint); }
#modal-form { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--ink-soft); }
.field input, .field select {
  border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-family: var(--font-ui); font-size: 13px;
  background: var(--bg); color: var(--ink);
}
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.content > .panel { margin-bottom: 16px; }



/* Feedbacks: continuidade visual da ficha, com o histórico em primeiro plano. */
.fb-summary { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
.fb-summary p { max-width:680px; }
.fb-picker { min-width:min(100%,300px); max-width:100%; }
.fb-overview { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; margin-top:15px; }
.fb-person { display:block; padding:16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--ink); text-decoration:none; }
.fb-person:hover, .fb-person:focus-visible { border-color:var(--ink-soft); background:var(--surface-2); }
.fb-person strong { display:block; font-size:14px; }
.fb-person small { color:var(--ink-faint); display:block; margin-top:3px; }
.fb-person-meta { display:flex; justify-content:space-between; margin-top:12px; font-size:12px; color:var(--ink-soft); }
.fb-history { border-left:2px solid var(--border); margin:18px 0 0 9px; padding-left:22px; }
.fb-entry { position:relative; padding:0 0 22px; }
.fb-entry::before { content:''; position:absolute; left:-29px; top:5px; width:10px; height:10px; border-radius:50%; background:var(--ink); border:3px solid var(--surface); box-shadow:0 0 0 1px var(--border); }
.fb-entry:last-child { padding-bottom:0; }
.fb-entry-head { display:flex; justify-content:space-between; align-items:start; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.fb-entry-head h2 { font-size:16px; margin:2px 0 0; }
.fb-score { font-size:20px; font-weight:600; font-family:var(--font-mono); white-space:nowrap; }
.fb-score small { font:400 11px var(--font-ui); color:var(--ink-faint); }
.fb-competencies { display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:9px; }
.fb-competency { border-top:1px solid var(--border); padding-top:8px; }
.fb-competency span { display:flex; justify-content:space-between; font-size:12px; gap:6px; }
.fb-competency .bar { margin-top:7px; }
.fb-text-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:18px; }
.fb-text-grid h3 { margin:0 0 5px; }
.fb-text-grid p, .fb-action p { white-space:pre-wrap; overflow-wrap:anywhere; }
.fb-action { margin-top:15px; padding:13px 15px; border:1px solid var(--border); border-radius:6px; }
.fb-action h3 { margin:0 0 5px; }
.fb-action-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:12px; }
.fb-trend { display:flex; align-items:flex-end; gap:10px; min-height:132px; overflow-x:auto; border-bottom:1px solid var(--border); padding:4px 4px 0; }
.fb-trend-item { min-width:66px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; text-align:center; font-size:11px; }
.fb-trend-bar { width:25px; background:var(--ink); border-radius:3px 3px 0 0; }
.fb-trend-item time { color:var(--ink-faint); white-space:nowrap; }
.fb-form-scores { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.fb-form-scores .field { margin:0; }
.field textarea { width:100%; min-height:70px; border:1px solid var(--border); border-radius:6px; padding:8px 10px; font:13px var(--font-ui); background:var(--bg); color:var(--ink); resize:vertical; }
.fb-modal { max-width:660px; }
@media(max-width:640px) { .fb-text-grid, .fb-form-scores { grid-template-columns:1fr; } .fb-summary .btn { width:100%; } .fb-picker { width:100%; } }

</style>

<script>

// ===== Regras de negócio replicadas fielmente das fórmulas da planilha =====
// Todas as datas são strings 'YYYY-MM-DD'. Funções puras (facilita teste e reuso).

const DAY = 86400000;

function toDate(s) {
  if (!s) return null;
  const [y, m, d] = s.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function fmtDate(dt) {
  if (!dt) return '';
  return dt.toISOString().slice(0, 10);
}
function addDays(dt, n) {
  return new Date(dt.getTime() + n * DAY);
}
function addMonths(dt, n) {
  const d = new Date(dt.getTime());
  const day = d.getUTCDate();
  d.setUTCMonth(d.getUTCMonth() + n);
  // corrige overflow de dia (ex: 31 jan + 1 mês)
  if (d.getUTCDate() < day) d.setUTCDate(0);
  return d;
}
function diffDays(a, b) {
  return Math.round((a.getTime() - b.getTime()) / DAY);
}
function diffMonths(a, b) {
  return (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + (b.getUTCMonth() - a.getUTCMonth()) - (b.getUTCDate() < a.getUTCDate() ? 1 : 0);
}
function fmtBRL(v) {
  if (v === '' || v === null || v === undefined || isNaN(v)) return '—';
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function fmtDateBR(s) {
  if (!s) return '—';
  const [y, m, d] = s.split('-');
  return `${d}/${m}/${y}`;
}

// ---- Faixas configuráveis (hoje fixas na fórmula da planilha; aqui viram SETTINGS) ----
const VA_TIERS = [
  { maxMeses: 3, valor: 100 },
  { maxMeses: 6, valor: 150 },
  { maxMeses: 12, valor: 250 },
  { maxMeses: 24, valor: 350 },
  { maxMeses: Infinity, valor: 400 },
];
// Comissão calculada sobre o valor total de vendas do mês (não progressiva por parcela).
// A taxa sobe ao atingir cada faixa; acima de R$ 130.000,00 aplica-se o teto de 4%.
const COMMISSION_TIERS = [
  { min: 0, pct: 0 },
  { min: 30000, pct: 0.01 },
  { min: 50000, pct: 0.015 },
  { min: 60000, pct: 0.02 },
  { min: 70000, pct: 0.025 },
  { min: 90000, pct: 0.03 },
  { min: 100000, pct: 0.035 },
  { min: 130000.01, pct: 0.04 },
];
const INSS_ALIQUOTA = 0.07648888;
const INSS_TETO = 908.86;

function tempoDeCasaMeses(dataAdmissao, refDate) {
  const adm = toDate(dataAdmissao);
  if (!adm) return null;
  return diffMonths(adm, refDate);
}

function calcVA(employee, refDate) {
  if (!employee.dataAdmissao) return '';
  if (employee.status === 'Inativo') return 0;
  if (employee.vaFixoOverride != null && employee.vaFixoOverride !== '') return Number(employee.vaFixoOverride);
  const meses = tempoDeCasaMeses(employee.dataAdmissao, refDate);
  for (const tier of VA_TIERS) if (meses < tier.maxMeses) return tier.valor;
  return VA_TIERS[VA_TIERS.length - 1].valor;
}

// Vigência salarial ativa numa data de referência
function salarioVigente(employeeId, refDate, salaryHistory) {
  const vigs = salaryHistory.filter(v => v.employeeId === employeeId);
  let best = null;
  for (const v of vigs) {
    const ini = toDate(v.inicioVigencia);
    if (!ini || ini > refDate) continue;
    const fim = toDate(v.fimVigencia);
    if (fim && fim < refDate) continue;
    if (!best || ini > toDate(best.inicioVigencia)) best = v;
  }
  return best;
}

function calcINSS(bruto) {
  if (bruto === '' || bruto === null) return '';
  return Math.round(Math.min(bruto * INSS_ALIQUOTA, INSS_TETO) * 100) / 100;
}

function calcTempoDeCasaTexto(employee, refDate) {
  const adm = toDate(employee.dataAdmissao);
  if (!adm) return '—';
  const fim = employee.dataDesligamento ? toDate(employee.dataDesligamento) : refDate;
  let months = diffMonths(adm, fim);
  const anos = Math.floor(months / 12);
  const mesesRest = months % 12;
  const base = addMonths(adm, months);
  const dias = diffDays(fim, base);
  return `${anos} anos, ${mesesRest} meses, ${dias} dias`;
}

function calcStatusExperiencia(employee, refDate) {
  const adm = toDate(employee.dataAdmissao);
  if (!adm || employee.status === 'Inativo') return '—';
  const fim90 = addDays(adm, 89);
  if (refDate > fim90) return 'Concluído';
  const restam = diffDays(fim90, refDate);
  if (restam <= 7) return '⚠️ Alerta 7 dias';
  if (restam <= 30) return 'À vencer';
  return '✅ OK';
}

function calcExamStatus(exam, refDate) {
  if (!exam.dataRealizacao) return 'Não Realizado';
  const prox = addMonths(toDate(exam.dataRealizacao), exam.validadeMeses || 12);
  if (prox < refDate) return 'Vencido';
  if (diffDays(prox, refDate) <= 30) return 'Próximo';
  return 'Em dia';
}
function proximoExameData(exam) {
  if (!exam.dataRealizacao) return null;
  return addMonths(toDate(exam.dataRealizacao), exam.validadeMeses || 12);
}

// Férias: aquisitivo/concessivo a partir do aniversário de contrato
function vacationDerived(vac, employee, refDate) {
  const adm = toDate(employee.dataAdmissao);
  const out = {};
  if (!adm) return out;
  const inicio = toDate(vac.inicioFerias);
  let aquisitivoInicio, aquisitivoFim;
  if (inicio) {
    const mesesDesdeAdm = diffMonths(adm, inicio);
    const ciclo = Math.floor(mesesDesdeAdm / 12);
    aquisitivoInicio = addMonths(adm, ciclo * 12);
  } else {
    // sem início marcado: usa o ciclo corrente em relação a hoje
    const mesesDesdeAdm = diffMonths(adm, refDate);
    const ciclo = Math.floor(mesesDesdeAdm / 12);
    aquisitivoInicio = addMonths(adm, ciclo * 12);
  }
  aquisitivoFim = addDays(addMonths(aquisitivoInicio, 12), -1);
  const concessivoLimite = addMonths(aquisitivoFim, 12);
  out.aquisitivoInicio = fmtDate(aquisitivoInicio);
  out.aquisitivoFim = fmtDate(aquisitivoFim);
  out.concessivoLimite = fmtDate(concessivoLimite);

  const abono = Number(vac.diasAbono) || 0;
  const qtdEfetiva = (vac.qtdDiasBase || 30) - abono;
  out.qtdDiasEfetiva = qtdEfetiva;
  if (inicio) {
    const retorno = addDays(inicio, qtdEfetiva);
    out.retorno = fmtDate(retorno);
    if (refDate >= inicio && refDate < retorno) out.statusPeriodo = 'Em gozo';
    else if (refDate >= retorno) out.statusPeriodo = (retorno <= concessivoLimite) ? 'Quitado' : 'Quitado c/ atraso';
    else out.statusPeriodo = 'Vigente';
    out.dataLimitePagamento = fmtDate(addDays(inicio, -2));
  } else {
    out.statusPeriodo = refDate > concessivoLimite ? 'Vencido' : 'Vigente';
  }
  out.diasParaVencerConcessivo = (out.statusPeriodo === 'Quitado' || out.statusPeriodo === 'Quitado c/ atraso') ? null : diffDays(concessivoLimite, refDate);
  return out;
}

function calcComissaoPJ(valorVendas) {
  const vendas = Number(valorVendas) || 0;
  if (vendas < COMMISSION_TIERS[0].min) return { pct: 0, valor: 0 };
  let aplicada = COMMISSION_TIERS[0];
  for (const faixa of COMMISSION_TIERS) {
    if (vendas < faixa.min) break;
    aplicada = faixa;
  }
  return { pct: aplicada.pct, valor: Math.round(vendas * aplicada.pct * 100) / 100 };
}

// Sugestão do próximo período aquisitivo/concessivo, a partir do fim do período aquisitivo já calculado
// (usado para "no retorno do colaborador, sugerir o próximo período de férias").
function proximoPeriodoSugerido(der) {
  if (!der || !der.aquisitivoFim) return null;
  const fimAtual = toDate(der.aquisitivoFim);
  const nextAquisitivoInicio = addDays(fimAtual, 1);
  const nextAquisitivoFim = addDays(addMonths(nextAquisitivoInicio, 12), -1);
  const nextConcessivoLimite = addMonths(nextAquisitivoFim, 12);
  return {
    aquisitivoInicio: fmtDate(nextAquisitivoInicio),
    aquisitivoFim: fmtDate(nextAquisitivoFim),
    concessivoLimite: fmtDate(nextConcessivoLimite),
    sugestaoInicio: fmtDate(addDays(nextAquisitivoFim, 1)),
  };
}

// Banco de horas: período fixo do dia 21 de um mês ao dia 20 do mês seguinte, referente ao mês seguinte.
// Ex.: 21/02 a 20/03 -> competência 03 (março).
function competenciaBancoHoras(dataStr) {
  const d = toDate(dataStr);
  if (!d) return null;

// ===================== FÉRIAS — módulo de fruição por período aquisitivo =====================
const DIAS_DIREITO_FERIAS = 30;

// Ciclo aquisitivo (12 meses a partir da admissão) que contém a data de referência.
function cicloAquisitivo(dataAdmissao, refDate) {
  const adm = toDate(dataAdmissao);
  if (!adm) return null;
  const meses = diffMonths(adm, refDate);
  const ciclo = Math.floor(meses / 12);
  const inicio = addMonths(adm, ciclo * 12);
  const fim = addDays(addMonths(inicio, 12), -1);
  const concessivoLimite = addMonths(fim, 12);
  return { aquisitivoInicio: fmtDate(inicio), aquisitivoFim: fmtDate(fim), concessivoLimite: fmtDate(concessivoLimite) };
}
// Próximo ciclo, dado o fim do ciclo anterior.
function proximoCiclo(aquisitivoFimAnteriorStr) {
  const fimAnterior = toDate(aquisitivoFimAnteriorStr);
  const inicio = addDays(fimAnterior, 1);
  const fim = addDays(addMonths(inicio, 12), -1);
  const concessivoLimite = addMonths(fim, 12);

}
// Quanto já foi consumido (gozado de fato + vendido) num conjunto de fruições do MESMO período aquisitivo.
// "Gozado" só conta quando a data de retorno já passou; dias agendados para o futuro ficam em "programados"

function consumoPeriodo(fruicoes, refDate) {

  (fruicoes || []).forEach(f => {
    if (f.statusFruicao === 'Cancelado') return;
    vendidos += f.diasAbono || 0;
    const g = f.diasGozo || 0;
    if (!g) return;
    if (!f.inicioFerias) { programados += g; return; }
    const inicio = toDate(f.inicioFerias);
    const retorno = addDays(inicio, g);
    if (retorno <= refDate) gozados += g;
    else programados += g;
  });
  const consumidos = gozados + vendidos;
  return { gozados, vendidos, programados, consumidos, restante: Math.max(0, DIAS_DIREITO_FERIAS - consumidos) };
}
// Status "ao vivo" de uma fruição individual (para exibição).
function statusFruicaoDerivado(f, refDate) {
  if (f.statusFruicao === 'Cancelado') return 'Cancelado';
  if (!f.inicioFerias) return 'Pendente';
  if (!f.diasGozo) return f.statusFruicao === 'Pendente' ? 'Pendente' : 'Confirmado';
  const inicio = toDate(f.inicioFerias);
  const retorno = addDays(inicio, f.diasGozo);
  if (refDate >= inicio && refDate < retorno) return 'Em gozo';
  if (refDate >= retorno) return 'Concluído';

// ===================== IMPORTAÇÃO DE EXTRATO DE BANCO DE HORAS (relatório de outro sistema, ex.: Control iD) =====================
function normalizeNome(s) {

}

function brDateToISO(d) {

}
// Extrai um registro (1 colaborador) do texto de uma página do relatório "Extrato Banco Horas".
// Recebe o texto já concatenado da página (ordem de leitura); tolera espaçamento variável.
function parseExtratoPagina(textoBruto) {
  const t = (textoBruto || '').replace(/\s+/g, ' ').trim();
  const nomeMatch = t.match(/NOME DO FUNCION[ÁA]RIO:\s*([A-ZÀ-Úa-zà-ú\s]+?)\s*(?:PIS DO FUNCION[ÁA]RIO|CTPS DO FUNCION[ÁA]RIO|DATA DE ADMISS[ÃA]O|N[ÚU]MERO DA FOLHA|NOME DO CARGO|NOME DO DEPARTAMENTO)/);
  const periodoMatch = t.match(/DE\s*(\d{2}\/\d{2}\/\d{4})\s*AT[ÉE]\s*(\d{2}\/\d{2}\/\d{4})/);

  const totalMatch = t.match(/TOTAL\s+(-?\d{1,3}:\d{2})\s+(-?\d{1,3}:\d{2})\s+(-?\d{1,3}:\d{2})\s+(-?\d{1,3}:\d{2})\s+(-?\d{1,3}:\d{2})/);

  const periodoLinha = periodoMatch && t.match(/\d{2}\/\d{2}\/\d{4}\s+AT[ÉE]\s+\d{2}\/\d{2}\/\d{4}\s+(-?\d{1,3}:\d{2})\s+(-?\d{1,3}:\d{2})\s+(-?\d{1,3}:\d{2})\s+(-?\d{1,3}:\d{2})\s+(-?\d{1,3}:\d{2})/);
  const valores = totalMatch ? totalMatch.slice(1) : (periodoLinha ? periodoLinha.slice(1) : null);
  if (!nomeMatch || !valores) return null;
  return {
    nome: nomeMatch[1].trim(),
    periodoInicio: periodoMatch ? brDateToISO(periodoMatch[1]) : null,
    periodoFim: periodoMatch ? brDateToISO(periodoMatch[2]) : null,
    bancoTotal: hhmmToDecimal(valores[0]),
    bancoPositivo: hhmmToDecimal(valores[1]),

function sugerirColaborador(nomeExtraido, employees) {

  const toks = (n) => normalizeNome(n).replace(/\./g, '').split(' ').filter(t => t && !stop.has(t));
  const a = toks(nomeExtraido);
  let best = null, bestScore = 0;
  employees.forEach(e => {
    const b = toks(e.nome);
    const inter = a.filter(t => b.some(u => u === t || (t.length > 1 && u.length > 1 && (t.startsWith(u) || u.startsWith(t))))).length;
    const uniao = new Set([...a, ...b]).size;
    const score = uniao ? inter / uniao : 0;
    const mesmoPrimeiro = a[0] && b[0] && a[0] === b[0];

// Custo estimado das horas negativas de banco de horas, com base no salário vigente (divisor legal padrão 220h/mês).
const DIVISOR_HORA_MENSAL = 220;

function custoHorasNegativas(salarioMensal, saldoNegativoHoras) {
  if (!salarioMensal || saldoNegativoHoras >= 0) return { valorHora: salarioMensal ? salarioMensal / DIVISOR_HORA_MENSAL : 0, prejuizo: 0, diasParaEquilibrio: 0 };
  const valorHora = salarioMensal / DIVISOR_HORA_MENSAL;
  const horasDevidas = Math.abs(saldoNegativoHoras);
  const prejuizo = horasDevidas * valorHora;
  const diasParaEquilibrio = horasDevidas / HORAS_POR_DIA_PADRAO;
  return { valorHora, prejuizo, diasParaEquilibrio, horasDevidas };

// Versão das regras aplicadas — toda prévia congelada registra com qual versão foi calculada.

// Seção 7 — Aviso-prévio: 30 dias + 3 por ano completo de serviço, teto 90.
function diasAvisoPrevio(dataAdmissao, dataReferencia) {
  const adm = toDate(dataAdmissao), ref = toDate(dataReferencia);
  if (!adm || !ref || ref < adm) return null;
  const mesesCompletos = diffMonths(adm, ref);

}

// Seção 10 — Saldo de salário: base diária pelo nº real de dias do mês da rescisão (mês cheio = salário cheio).
function saldoDeSalario(salarioMensal, dataDesligamento) {
  const d = toDate(dataDesligamento);
  if (!d || !salarioMensal) return null;
  const ano = d.getUTCFullYear(), mes = d.getUTCMonth() + 1;
  const totalDiasMes = diasNoMes(ano, mes);
  const diasTrabalhados = d.getUTCDate();
  const baseDiaria = salarioMensal / totalDiasMes;
  const valor = round2(baseDiaria * diasTrabalhados);
  return { baseDiaria: round2(baseDiaria), diasTrabalhados, totalDiasMes, valor };
}

// Seção 6/11 — Avos: cada mês do período com >=15 dias computáveis gera 1 avo (máx. 12).
function calcularAvos(dataInicioPeriodo, dataFimPeriodo) {
  const ini = toDate(dataInicioPeriodo), fim = toDate(dataFimPeriodo);
  if (!ini || !fim || fim < ini) return 0;

    const ano = cursor.getUTCFullYear(), mes = cursor.getUTCMonth();
    const fimMes = new Date(Date.UTC(ano, mes + 1, 0));
    const fimPeriodoNesteMes = fim < fimMes ? fim : fimMes;
    const diasNesteMes = diffDays(fimPeriodoNesteMes, cursor) + 1;
    if (diasNesteMes >= 15) avos++;

// Seção 11/12 — Férias proporcionais e adquiridas (regra dos 4/3, Lei 7.238/84).
function feriasProporcionais(baseFerias, avos) {

}

  DB.employees.forEach(e => gestorNomes(e.gestor).forEach(nome => {
    const chave = normalizeGestor(nome);
    if (!nomes.has(chave)) nomes.set(chave, nome);
  }));
  return [...nomes.values()].sort((a, b) => a.localeCompare(b, 'pt-BR'));
}
// Perfil Gestor sem nome escolhido não recebe acesso geral. Este seletor é apenas simulação:
// autenticação e permissões reais exigem controle no servidor antes de publicar dados de RH.
function isGestorScoped() { return SESSION.role === 'Gestor'; }
function visibleEmployees() {
  if (isGestorScoped()) return DB.employees.filter(e => gestorMatches(e.gestor, SESSION.scopeId));
  return DB.employees;
}
function canViewEmployee(e) {
  if (!e) return false;
  if (isGestorScoped()) return gestorMatches(e.gestor, SESSION.scopeId);
  return true;
}
function restrictedEmployeeView() {
  return `<div class="page-head"><h1>Acesso restrito</h1></div><div class="empty">Este colaborador não faz parte da sua equipe. Como Gestor, você só visualiza quem está sob a sua gestão — o RH continua com acesso a todos.</div>`;
}

// Exames vencidos ou vencendo em até 7 dias, só para colaboradores ativos/afastados — alimenta o pop-up de abertura e o banner do Dashboard.
function examsCriticos() {
  const out = [];
  DB.exams.forEach(ex => {
    const emp = DB.employees.find(e => e.id === ex.employeeId);
    if (!isActiveEmployee(emp) || !ex.dataRealizacao) return;
    if (!canViewEmployee(emp)) return;
    const prox = L.proximoExameData(ex);
    const dias = L.diffDays(prox, REF);
    if (dias <= 7) out.push({ emp, ex, dias, prox });
  });
  return out.sort((a, b) => a.dias - b.dias);
}

function examBannerHtml() {
  const criticos = examsCriticos();
  if (!criticos.length) return '';
  const rows = criticos.map(c => `<tr class="clickable" data-nav="#/colaboradores/${c.emp.id}">
    <td>${c.emp.nome}</td><td>${c.ex.tipo || '—'}</td><td class="mono">${L.fmtDateBR(L.fmtDate(c.prox))}</td>
    <td>${c.dias < 0 ? badge('Vencido há ' + Math.abs(c.dias) + ' dia(s)', 'bad') : badge(c.dias === 0 ? 'Vence hoje' : `Vence em ${c.dias} dia(s)`, 'warn')}</td></tr>`);
  return `<section class="panel" style="border-color: var(--bad); margin-bottom: 16px;">
    <h2 style="color: var(--bad);">⚠️ Exames ocupacionais vencendo em até 7 dias</h2>
    ${table(['Colaborador', 'Tipo', 'Data prevista', 'Situação'], rows)}
  </section>`;
}

/* ===================== FÉRIAS — reconciliação de períodos aquisitivos ===================== */
// Agrupa as fruições (não canceladas) de um colaborador por período aquisitivo (chave = aquisitivoInicio).
function agruparFruicoesPorPeriodo(employeeId) {
  const grupos = {};
  DB.vacations.filter(v => v.employeeId === employeeId && v.statusFruicao !== 'Cancelado' && v.aquisitivoInicio).forEach(f => {
    (grupos[f.aquisitivoInicio] = grupos[f.aquisitivoInicio] || []).push(f);
  });
  return grupos;
}
// Roda a cada render: para cada colaborador ativo, verifica se o período aquisitivo mais recente já foi
// totalmente quitado (dias gozados/vendidos = 30) e, se sim, gera automaticamente o próximo período
// aquisitivo + uma fruição "Pendente" aguardando definição — sem duplicar se já existir.
function reconciliarFerias() {
  DB.employees.forEach(e => {
    if (!e.dataAdmissao) return;
    const grupos = agruparFruicoesPorPeriodo(e.id);
    const chaves = Object.keys(grupos).sort();
    if (!chaves.length) return;
    const ultimaChave = chaves[chaves.length - 1];
    const fruicoes = grupos[ultimaChave];
    const consumo = L.consumoPeriodo(fruicoes, REF);
    if (consumo.restante > 0) return;
    const amostra = fruicoes[0];
    if (!amostra.aquisitivoFim) return;
    const proximo = L.proximoCiclo(amostra.aquisitivoFim);
    const jaExiste = DB.vacations.some(v => v.employeeId === e.id && v.aquisitivoInicio === proximo.aquisitivoInicio);
    if (jaExiste) return;
    DB.vacations.push({
      id: nextId('vacations'), employeeId: e.id, formaUtilizacao: null,
      inicioFerias: null, diasGozo: null, diasAbono: 0,
      statusFruicao: 'Pendente', statusAprovacao: 'Pendente', aprovadoPor: null, solicitou13: 'Não',
      avisoEmitido: 'Não', avisoAnexoNome: null, avisoAnexoData: null,
      reciboAnexoNome: null, reciboAnexoData: null,
      observacoesRH: 'Gerado automaticamente após quitação do período aquisitivo anterior.',
      aquisitivoInicio: proximo.aquisitivoInicio, aquisitivoFim: proximo.aquisitivoFim, concessivoLimite: proximo.concessivoLimite,
    });
  });
}
function emGozoDeFerias(employeeId) {
  return DB.vacations.some(f => f.employeeId === employeeId && f.statusFruicao !== 'Cancelado' && L.statusFruicaoDerivado(f, REF) === 'Em gozo');
}
function fruicaoStatusBadge(f) {
  const st = L.statusFruicaoDerivado(f, REF);
  return badge(st, statusKind(st));
}
function anexoBadge(nome) {
  return nome ? badge('Nome registrado', 'muted') : badge('Pendente', 'warn');
}
const FORMA_LABEL = { '30-corridos': '30 dias corridos', '20-abono': '20 dias + venda de 10 (abono)', '20-mais-10': '20 dias + 10 em outro período', 'legado': 'Legado (migrado)' };


/* ===================== DASHBOARD ===================== */
VIEWS.dashboard = function () {
  const clt = visibleEmployees();
  const pj = isGestorScoped() ? [] : DB.contractors;
  const ativosCLT = clt.filter(e => e.status === 'Ativo').length;
  const inativosCLT = clt.filter(e => e.status === 'Inativo').length;
  const ativosPJ = pj.filter(c => c.status === 'Ativo').length;

  const cltIds = new Set(clt.map(e => e.id));
  const examsAtivos = DB.exams.filter(ex => cltIds.has(ex.employeeId) && isActiveEmployee(DB.employees.find(e => e.id === ex.employeeId)));
  const examStatuses = examsAtivos.map(ex => L.calcExamStatus(ex, REF));
  const vencidos = examStatuses.filter(s => s === 'Vencido').length;
  const proximos = examStatuses.filter(s => s === 'Próximo').length;
  const emDia = examStatuses.filter(s => s === 'Em dia').length;

  const vacacoesAtivas = DB.vacations.filter(v => cltIds.has(v.employeeId) && v.statusFruicao !== 'Cancelado' && isActiveEmployee(DB.employees.find(e => e.id === v.employeeId)));
  const emGozoHoje = clt.filter(e => emGozoDeFerias(e.id)).length;
  const concessivoVencido = (() => {
    let n = 0;
    clt.forEach(e => {
      const grupos = agruparFruicoesPorPeriodo(e.id);
      Object.values(grupos).forEach(fs => {
        const consumo = L.consumoPeriodo(fs, REF);
        if (consumo.restante > 0 && fs[0].concessivoLimite && L.toDate(fs[0].concessivoLimite) < REF) n++;
      });
    });
    return n;
  })();

  const pjPaymentsAtivos = DB.pjPayments.filter(p => isActiveContractor(pj.find(c => c.id === p.contractorId)));
  const nfPendentes = pjPaymentsAtivos.filter(p => p.notaFiscal === 'Não Emitida').length;

  // Custo de folha — projeção com base nos valores vigentes hoje (salário CLT e valor fixo PJ), não no histórico de lançamentos (que costuma estar incompleto).
  const custoFolhaCLT = clt.filter(e => e.status === 'Ativo').reduce((s, e) => { const v = L.salarioVigente(e.id, REF, DB.salaryHistory); return s + (v ? v.salario : 0); }, 0);
  const custoPJFixo = pj.filter(c => c.status === 'Ativo').reduce((s, c) => s + (c.valorFixoMensal || 0), 0);
  const comissaoMedia = (() => {
    const comps = pjPaymentsAtivos.map(p => p.dataCompetencia).filter(Boolean).sort();
    const ultimaComp = comps[comps.length - 1];
    if (!ultimaComp) return 0;
    return pjPaymentsAtivos.filter(p => p.dataCompetencia === ultimaComp).reduce((s, p) => s + L.calcComissaoPJ(p.valorVendas).valor, 0);
  })();
  const custoPJTotal = custoPJFixo + comissaoMedia;
  const custoTotalPessoal = custoFolhaCLT + custoPJTotal;

  const mesAtual = new Date().getUTCMonth();
  const aniversariantesMes = [...clt.filter(isActiveEmployee), ...pj.filter(isActiveContractor)].filter(p => p.dataNasc && L.toDate(p.dataNasc).getUTCMonth() === mesAtual).length;

  const experienciasEmAlerta = clt
    .filter(e => e.status === 'Ativo' && L.calcStatusExperiencia(e, REF) === '⚠️ Alerta 7 dias')
    .map(e => ({ ...e, fimExperiencia: L.addDays(L.toDate(e.dataAdmissao), 89) }))
    .sort((a, b) => a.fimExperiencia - b.fimExperiencia);
  const expAlerta = experienciasEmAlerta.length;

  // Turnover mensal CLT: ((admissões + desligamentos) / 2) / headcount médio × 100.
  // A série usa os colaboradores visíveis neste perfil e os registros de admissão/desligamento disponíveis.
  const turnoverMonths = [];
  const refMonthStart = new Date(Date.UTC(REF.getUTCFullYear(), REF.getUTCMonth(), 1));
  for (let offset = 11; offset >= 0; offset--) {
    const start = new Date(Date.UTC(refMonthStart.getUTCFullYear(), refMonthStart.getUTCMonth() - offset, 1));
    const monthEnd = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + 1, 0));
    const end = monthEnd > REF ? REF : monthEnd;
    const admissions = clt.filter(e => { const d = L.toDate(e.dataAdmissao); return d && d >= start && d <= end; }).length;
    const separations = clt.filter(e => { const d = L.toDate(e.dataDesligamento); return d && d >= start && d <= end; }).length;
    const headcountAt = date => clt.filter(e => {
      const adm = L.toDate(e.dataAdmissao), sep = L.toDate(e.dataDesligamento);
      return adm && adm <= date && (!sep || sep >= date);
    }).length;
    const opening = headcountAt(start);
    const closing = headcountAt(end);
    const averageHeadcount = (opening + closing) / 2;
    const rate = averageHeadcount ? ((admissions + separations) / 2) / averageHeadcount * 100 : null;
    const monthLabel = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][start.getUTCMonth()] + '/' + String(start.getUTCFullYear()).slice(-2);
    turnoverMonths.push({ start, end, admissions, separations, opening, closing, averageHeadcount, rate, monthLabel, partial: end < monthEnd });
  }
  const turnoverRates = turnoverMonths.map(m => m.rate).filter(v => v != null);
  const turnoverScale = Math.max(5, Math.ceil(Math.max(0, ...turnoverRates) / 5) * 5);
  const turnoverTotalSeparations = turnoverMonths.reduce((sum, m) => sum + m.separations, 0);
  const highestTurnover = turnoverMonths.filter(m => m.rate != null).reduce((best, m) => !best || m.rate > best.rate ? m : best, null);
  const turnoverChart = turnoverMonths.map(m => {
    const rateLabel = m.rate == null ? '—' : m.rate.toFixed(1) + '%';
    const barHeight = m.rate == null ? 2 : Math.max(2, Math.min(76, m.rate / turnoverScale * 76));
    const color = m.rate != null && m.rate >= 10 ? 'var(--bad)' : 'var(--primary)';
    return `<div title="${m.monthLabel}: ${rateLabel}; ${m.admissions} admissão(ões), ${m.separations} desligamento(s)" style="flex:1; min-width:28px; height:108px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px;"><span class="mono" style="font-size:10px;">${rateLabel}</span><div style="height:${barHeight}px; width:min(24px,70%); background:${color}; border-radius:3px 3px 0 0;"></div><span class="muted" style="font-size:10px; white-space:nowrap;">${m.monthLabel}</span></div>`;
  }).join('');
  const turnoverTable = turnoverMonths.slice().reverse().map(m => `<tr><td class="mono">${m.monthLabel}${m.partial ? ' (parcial)' : ''}</td><td class="mono">${m.admissions}</td><td class="mono">${m.separations}</td><td class="mono">${m.opening}</td><td class="mono">${m.closing}</td><td class="mono">${m.averageHeadcount.toFixed(1)}</td><td class="mono">${m.rate == null ? '—' : m.rate.toFixed(1) + '%'}</td></tr>`);
  const feriasAprovadasPct = vacacoesAtivas.length ? (vacacoesAtivas.filter(v => v.statusAprovacao === 'Aprovado').length / vacacoesAtivas.length) : null;
  const nfEmitidaPct = pjPaymentsAtivos.length ? (pjPaymentsAtivos.filter(p => p.notaFiscal === 'Emitida').length / pjPaymentsAtivos.length) : null;
  const taxaExamesEmDia = examsAtivos.length ? emDia / examsAtivos.length : null;

  const kpis = [
    card(isGestorScoped() ? 'Minha equipe — Ativos' : 'Total CLT Ativos', ativosCLT, `${inativosCLT} inativos`),
    ...(isGestorScoped() ? [] : [card('Total PJ Ativos', ativosPJ, `${pj.length - ativosPJ} inativos`)]),
    card('Exames Vencidos', vencidos, `${proximos} próximos do vencimento · só colaboradores ativos`, vencidos ? 'bad' : 'ok'),
    card('Em Férias Hoje', emGozoHoje, `${concessivoVencido} com período concessivo vencido`, concessivoVencido ? 'bad' : 'ok'),
    ...(isGestorScoped() ? [] : [card('NF Pendentes (PJ)', nfPendentes, 'bloqueiam pagamento · só PJs ativos', nfPendentes ? 'warn' : 'ok')]),
    card('Aniversariantes do mês', aniversariantesMes, ''),
    card('Experiências em alerta', expAlerta, '≤ 7 dias para o fim dos 90 dias', expAlerta ? 'warn' : 'ok'),
  ];

  const kpisFolha = [
    card('Custo Folha CLT', L.fmtBRL(custoFolhaCLT), `${clt.filter(e => e.status === 'Ativo').length} colaborador(es) ativo(s)`),
    ...(isGestorScoped() ? [] : [
      card('Custo PJ', L.fmtBRL(custoPJTotal), `fixo ${L.fmtBRL(custoPJFixo)} + comissão do mês ${L.fmtBRL(comissaoMedia)}`),
      card('Custo total de pessoal', L.fmtBRL(custoTotalPessoal), 'CLT + PJ, projeção mensal', 'warn'),
    ]),
  ];

  function indicador(label, meta, atingido, fmt) {
    const pct = atingido == null ? null : atingido;
    const st = pct == null ? 'muted' : pct >= meta ? 'ok' : pct > meta * 0.5 ? 'warn' : 'bad';
    const pctText = pct == null ? '—' : (fmt === '%' ? (pct * 100).toFixed(0) + '%' : pct);
    return `<div class="indicator"><div class="indicator-top"><span>${label}</span><span class="badge badge-${st}">${pctText}</span></div>
      <div class="bar"><div class="bar-fill bar-${st}" style="width:${pct == null ? 0 : Math.min(100, (pct / meta) * 100)}%"></div></div>
      <div class="indicator-meta">Meta: ${fmt === '%' ? (meta * 100) + '%' : meta}</div></div>`;
  }

  return `
    <div class="page-head"><h1>Dashboard ${isGestorScoped() ? `— equipe de ${SESSION.scopeId}` : 'Executivo'}</h1><p>Indicadores calculados em tempo real${isGestorScoped() ? ', restritos à sua equipe' : ' a partir da base migrada, considerando apenas colaboradores/PJs ativos (ou afastados)'} · referência ${L.fmtDateBR(L.fmtDate(REF))}</p></div>
    ${examBannerHtml()}
    <div class="kpi-grid">${kpis.join('')}</div>
    <section class="panel" style="margin-top:16px;">
      <h2>Tendência de turnover CLT</h2>
      <p class="muted">Últimos 12 meses, com outubro parcial até ${L.fmtDateBR(L.fmtDate(REF))}. Taxa mensal = (admissões + desligamentos) ÷ 2 ÷ quadro médio × 100.</p>
      <div style="display:flex; align-items:flex-end; gap:5px; overflow-x:auto; padding:8px 0 4px; border-bottom:1px solid var(--border);">${turnoverChart}</div>
      <p class="muted" style="font-size:12px; margin-top:10px;">No período: <strong>${turnoverTotalSeparations}</strong> desligamento(s). ${highestTurnover ? `Maior taxa: <strong>${highestTurnover.rate.toFixed(1)}%</strong> em ${highestTurnover.monthLabel}.` : 'Sem base suficiente para calcular a taxa.'} A série considera apenas pessoas e datas registradas nesta base; meses anteriores à cobertura dos cadastros podem estar incompletos.</p>
      <details><summary class="muted" style="cursor:pointer; font-size:12px;">Ver dados mensais e quadro médio</summary>
        ${table(['Mês', 'Admissões', 'Desligamentos', 'Quadro inicial', 'Quadro final', 'Quadro médio', 'Turnover'], turnoverTable)}
      </details>
    </section>
    <h2 style="margin-top:20px;">Custo de folha — CLT e PJ separados</h2>
    <p class="muted" style="margin-top:-6px;">Projeção com base nos valores vigentes hoje (salário CLT atual e valor fixo PJ), não no histórico de lançamentos — que costuma estar incompleto. Não inclui encargos (INSS patronal, FGTS etc.).</p>
    <div class="kpi-grid">${kpisFolha.join('')}</div>
    <div class="two-col">
      <section class="panel">
        <h2>Metas e diagnóstico</h2>
        ${indicador('Taxa de exames em dia', 1, taxaExamesEmDia, '%')}
        ${indicador('Férias aprovadas', 0.8, feriasAprovadasPct, '%')}
        ${isGestorScoped() ? '' : indicador('PJs com NF emitida', 1, nfEmitidaPct, '%')}
      </section>
      <section class="panel">
        <h2>Headcount por departamento</h2>
        ${table(['Departamento', 'CLT ativos'], Object.entries(clt.filter(e => e.status === 'Ativo').reduce((acc, e) => { acc[e.departamento] = (acc[e.departamento] || 0) + 1; return acc; }, {})).sort((a, b) => b[1] - a[1]).map(([d, n]) => `<tr><td>${d}</td><td>${n}</td></tr>`))}
      </section>
    </div>`;
};

VIEWS.colaboradores = function (param) {
  if (param) return VIEWS.colaboradorDetalhe(param);
  let list = visibleEmployees();
  const filtro = LIST_FILTERS.colaboradores;
  if (filtro === 'Ativo') list = list.filter(e => e.status !== 'Inativo');
  else if (filtro === 'Inativo') list = list.filter(e => e.status === 'Inativo');
  const filterBar = `<select id="filtro-colab-status" class="select-filter">
      <option value="Ativo" ${filtro === 'Ativo' ? 'selected' : ''}>Ativos (+ afastados)</option>
      <option value="Inativo" ${filtro === 'Inativo' ? 'selected' : ''}>Inativos</option>
      <option value="Todos" ${filtro === 'Todos' ? 'selected' : ''}>Todos</option>
    </select>`;
  const mostrandoInativos = filtro === 'Inativo';
  const rows = list.map(e => {
    if (mostrandoInativos) {
      return `<tr class="clickable" data-nav="#/colaboradores/${e.id}">

        <td class="mono">${L.fmtDateBR(e.dataDesligamento)}</td>
        <td class="muted">apenas informativo — fora das regras/cálculos operacionais</td>
        <td>${badge(e.status, statusKind(e.status))}</td>
        <td><button class="btn btn-primary" data-action="toggle-status-emp" data-id="${e.id}">Reativar</button></td></tr>`;
    }
    const vig = L.salarioVigente(e.id, REF, DB.salaryHistory);
    return `<tr class="clickable" data-nav="#/colaboradores/${e.id}">
      <td class="mono">${e.id}</td><td>${e.nome}</td><td>${e.cargo}</td><td>${e.departamento || '—'}</td>
      <td class="mono">${L.fmtDateBR(e.dataAdmissao)}</td>
      <td class="mono">${L.fmtBRL(vig ? vig.salario : null)}</td>
      <td>${badge(e.status, statusKind(e.status))}</td></tr>`;
  });
  const headers = mostrandoInativos ? ['ID', 'Nome', 'Cargo', 'Departamento', 'Desligamento', 'Observação', 'Status', 'Ação'] : ['ID', 'Nome', 'Cargo', 'Departamento', 'Admissão', 'Salário vigente', 'Status'];
  return `
    <div class="page-head"><h1>Colaboradores CLT</h1><p>Cadastro mestre — ${list.length} registro(s). ${mostrandoInativos ? 'Inativos entram aqui só como registro histórico — não contam em dashboards, alertas ou indicadores.' : 'Todas as regras e cálculos do sistema consideram apenas colaboradores ativos/afastados.'}</p></div>
    ${toolbar(`${filterBar}<button class="btn btn-primary" data-action="novo-colaborador">+ Novo colaborador</button>`)}
    ${table(headers, rows)}`;
};

VIEWS.colaboradorDetalhe = function (id) {
  const e = DB.employees.find(x => String(x.id) === String(id));
  if (!e) return `<div class="empty">Colaborador não encontrado.</div>`;
  if (!canViewEmployee(e)) return restrictedEmployeeView();
  const vig = L.salarioVigente(e.id, REF, DB.salaryHistory);
  const hist = DB.salaryHistory.filter(h => h.employeeId === e.id).sort((a, b) => (a.inicioVigencia < b.inicioVigencia ? 1 : -1));
  const exams = DB.exams.filter(x => x.employeeId === e.id);
  const vacs = DB.vacations.filter(v => v.employeeId === e.id);
  const pays = DB.payroll.filter(p => p.employeeId === e.id).sort((a, b) => (a.competencia < b.competencia ? 1 : -1));
  const docs = DB.documents.filter(d => d.employeeId === e.id);
  const movs = DB.movements.filter(m => m.employeeId === e.id).sort((a, b) => (a.data < b.data ? 1 : -1));
  const leaves = DB.leaves.filter(l => l.employeeId === e.id);
  const tbank = DB.timeBank.filter(t => t.employeeId === e.id);
  const saldoHoras = tbank.reduce((s, t) => s + (t.horas || 0), 0);
  const openOff = DB.offboardings.find(o => o.employeeId === e.id && o.status === 'Em andamento');

  return `
    <div class="page-head"><a href="#/colaboradores" class="breadcrumb">← Colaboradores CLT</a>
      <h1>${e.nome} <span class="mono muted">#${e.id}</span></h1>
      <p>${e.cargo} · ${e.departamento || '—'} · ${badge(e.status, statusKind(e.status))} ${e.statusWorkflow ? badge(e.statusWorkflow, 'muted') : ''} ${emGozoDeFerias(e.id) ? badge('Em gozo de férias', 'warn') : ''}</p></div>

    ${openOff ? `<section class="panel" style="margin-bottom:16px;"><h2>Desligamento em andamento</h2>${offboardingChecklistHtml(openOff)}</section>` : ''}

    ${ROLE_MENU[SESSION.role].includes('feedbacks') ? `<section class="panel" style="margin-bottom:16px;"><h2>Feedbacks e evolução</h2><p>${DB.feedbacks.filter(f => Number(f.employeeId) === Number(e.id)).length} avaliação(ões) registrada(s). Consulte as competências, o histórico e os planos de ação.</p><a class="btn" href="#/feedbacks/${e.id}">Ver evolução de ${escapeHtml(e.nome)}</a></section>` : ''}

    <div class="two-col">
      <section class="panel">
        <h2>Dados cadastrais</h2>

/* ===================== FÉRIAS (GERAL) ===================== */
VIEWS.ferias = function () {
  const empScope = visibleEmployees();
  const ids = new Set(empScope.map(e => e.id));
  let list = DB.vacations.filter(v => ids.has(v.employeeId) && v.statusFruicao !== 'Cancelado');

  // --- painel-resumo: seis situações pedidas, visíveis de um olhar só ---
  const programadas = [], avisoPendente = [], reciboPendente = [], emGozo = [], saldoPendente = [], quitadas = [];
  empScope.forEach(e => {
    if (!isActiveEmployee(e)) return;
    const grupos = agruparFruicoesPorPeriodo(e.id);
    const chaves = Object.keys(grupos).sort();
    if (chaves.length) {
      const ultima = grupos[chaves[chaves.length - 1]];
      const consumo = L.consumoPeriodo(ultima, REF);
      if (consumo.restante > 0) saldoPendente.push({ e, restante: consumo.restante });
      else quitadas.push(e);
    }
    DB.vacations.filter(v => v.employeeId === e.id && v.statusFruicao !== 'Cancelado').forEach(f => {
      if (!f.diasGozo || !f.inicioFerias) return;
      const inicio = L.toDate(f.inicioFerias);
      const retorno = L.toDate(L.retornoFruicao(f));
      const diasParaInicio = L.diffDays(inicio, REF);
      if (REF >= inicio && REF < retorno) emGozo.push({ e, f });
      else if (REF < inicio) programadas.push({ e, f });
      if (diasParaInicio >= 0 && diasParaInicio <= 32 && !f.avisoAnexoNome) avisoPendente.push({ e, f, dias: diasParaInicio });
      if (diasParaInicio >= 0 && diasParaInicio <= 2 && !f.reciboAnexoNome) reciboPendente.push({ e, f, dias: diasParaInicio });
    });
  });

  const resumo = [
    card('Com férias programadas', programadas.length, 'agendadas, ainda não iniciadas'),
    card('Aviso de férias pendente', avisoPendente.length, 'alerta 32 dias antes do início', avisoPendente.length ? 'warn' : 'ok'),
    card('Recibo de férias pendente', reciboPendente.length, 'alerta 2 dias antes do início', reciboPendente.length ? 'bad' : 'ok'),
    card('Em gozo de férias', emGozo.length, 'hoje'),
    card('Com saldo pendente no período', saldoPendente.length, 'período aquisitivo ainda em aberto', saldoPendente.length ? 'warn' : 'ok'),
    card('Períodos totalmente quitados', quitadas.length, ''),
  ];

  const rows = list.slice().sort((a, b) => (a.aquisitivoInicio < b.aquisitivoInicio ? 1 : -1)).map(v => {
    const e = DB.employees.find(x => x.id === v.employeeId) || {};
    const retorno = L.retornoFruicao(v);
    return `<tr class="clickable" data-nav="#/colaboradores/${v.employeeId}">
      <td>${e.nome || v.employeeId}</td>
      <td class="muted">${FORMA_LABEL[v.formaUtilizacao] || '—'}</td>
      <td class="mono">${v.inicioFerias ? L.fmtDateBR(v.inicioFerias) : '—'}</td>
      <td class="mono">${retorno ? L.fmtDateBR(retorno) : '—'}</td>
      <td class="mono">${v.diasGozo ?? '—'}</td><td class="mono">${v.diasAbono || 0}</td>
      <td class="mono muted">${v.aquisitivoInicio ? L.fmtDateBR(v.aquisitivoInicio) + ' – ' + L.fmtDateBR(v.aquisitivoFim) : '—'}</td>
      <td>${fruicaoStatusBadge(v)}</td>
      <td>${v.diasGozo ? anexoBadge(v.avisoAnexoNome) : '—'}</td>
      <td>${v.diasGozo ? anexoBadge(v.reciboAnexoNome) : '—'}</td></tr>`;
  });
  return `<div class="page-head"><h1>Férias</h1><p>Programação e histórico — ${list.length} registro(s)${isGestorScoped() ? ' — apenas da sua equipe' : ''}.</p></div>
    <div class="kpi-grid">${resumo.join('')}</div>
    ${table(['Colaborador', 'Forma', 'Início', 'Retorno', 'Gozo', 'Abono', 'Período aquisitivo', 'Status', 'Aviso', 'Recibo'], rows)}`;
};

    const inss = L.calcINSS(bruto);
    const liquido = bruto + (p.ajudaCusto || 0) - inss - (p.vt || 0) - (p.outrosDescontos || 0);
    return `<tr class="clickable" data-nav="#/colaboradores/${p.employeeId}"><td>${empName(p.employeeId)}</td><td class="mono">${p.competencia}</td><td class="mono">${L.fmtBRL(bruto)}</td><td class="mono">${L.fmtBRL(inss)}</td><td class="mono">${L.fmtBRL(liquido)}</td><td>${badge(p.status, statusKind(p.status))}</td></tr>`;
  });
  return `<div class="page-head"><h1>Folha CLT</h1><p>Controle gerencial — não substitui o cálculo oficial de folha de pagamento. INSS estimado (7,648888%, teto R$ 908,86). ${DB.payroll.length} lançamento(s) no total, exibindo os 150 mais recentes.</p></div>

};

/* ===================== CENTRAL DE ALERTAS ===================== */
function computeAlerts() {
  const alerts = [];
  const scoped = isGestorScoped();
  const empPool = visibleEmployees();
  const empIds = new Set(empPool.map(e => e.id));
  DB.exams.forEach(ex => {
    if (!empIds.has(ex.employeeId)) return;
    const emp = DB.employees.find(e => e.id === ex.employeeId);
    if (!isActiveEmployee(emp)) return;
    const st = L.calcExamStatus(ex, REF);
    if (st === 'Vencido') alerts.push({ p: 'URGENTE', t: `Exame vencido — ${empName(ex.employeeId)}`, m: 'exames', link: `#/colaboradores/${ex.employeeId}` });
    else if (st === 'Próximo') alerts.push({ p: 'ATENÇÃO', t: `Exame próximo do vencimento — ${empName(ex.employeeId)}`, m: 'exames', link: `#/colaboradores/${ex.employeeId}` });
  });
  empPool.filter(isActiveEmployee).forEach(e => {
    const st = L.calcStatusExperiencia(e, REF);
    if (st === '⚠️ Alerta 7 dias') alerts.push({ p: 'URGENTE', t: `Experiência encerra em até 7 dias — ${e.nome}`, m: 'experiência', link: `#/colaboradores/${e.id}` });
    else if (st === 'À vencer') alerts.push({ p: 'ATENÇÃO', t: `Experiência à vencer (≤30 dias) — ${e.nome}`, m: 'experiência', link: `#/colaboradores/${e.id}` });
  });
  // Férias: concessivo vencendo/vencido por período aquisitivo em aberto, + Aviso (32 dias antes) e Recibo (2 dias antes) pendentes de anexo.
  empPool.filter(isActiveEmployee).forEach(e => {
    const grupos = agruparFruicoesPorPeriodo(e.id);
    Object.values(grupos).forEach(fs => {
      const consumo = L.consumoPeriodo(fs, REF);
      if (consumo.restante > 0 && fs[0].concessivoLimite) {
        const dias = L.diffDays(L.toDate(fs[0].concessivoLimite), REF);
        if (dias < 0) alerts.push({ p: 'URGENTE', t: `Período concessivo de férias vencido — ${e.nome}`, m: 'férias', link: `#/colaboradores/${e.id}` });
        else if (dias <= 30) alerts.push({ p: 'ATENÇÃO', t: `Período concessivo vence em ${dias} dia(s) — ${e.nome}`, m: 'férias', link: `#/colaboradores/${e.id}` });
      }
      fs.forEach(f => {
        if (!f.diasGozo || !f.inicioFerias) return;
        const diasParaInicio = L.diffDays(L.toDate(f.inicioFerias), REF);
        if (diasParaInicio >= 0 && diasParaInicio <= 32 && !f.avisoAnexoNome) alerts.push({ p: diasParaInicio <= 7 ? 'URGENTE' : 'ATENÇÃO', t: `Aviso de férias pendente de anexo — ${e.nome} (início em ${diasParaInicio} dia(s))`, m: 'férias', link: `#/colaboradores/${e.id}` });
        if (diasParaInicio >= 0 && diasParaInicio <= 2 && !f.reciboAnexoNome) alerts.push({ p: 'URGENTE', t: `Recibo de férias pendente de anexo — ${e.nome} (início em ${diasParaInicio} dia(s))`, m: 'férias', link: `#/colaboradores/${e.id}` });
      });
    });
  });
  if (!scoped) {
    DB.pjPayments.forEach(p => {
      const c = DB.contractors.find(x => x.id === p.contractorId);
      if (!isActiveContractor(c)) return;
      if (p.notaFiscal === 'Não Emitida') alerts.push({ p: 'ATENÇÃO', t: `Pagamento bloqueado — NF não emitida (${pjName(p.contractorId)})`, m: 'pagamentos PJ', link: `#/contratados/${p.contractorId}` });
    });
    DB.admissions.forEach(a => {
      if (a.stage !== 'Ativo') alerts.push({ p: 'INFORMATIVO', t: `Pré-admissão em "${a.stage}" — ${a.nome}`, m: 'admissões', link: '#/admissoes' });
    });
  }
  DB.offboardings.filter(o => o.status === 'Em andamento' && empIds.has(o.employeeId)).forEach(o => {
    const pend = o.tasks.filter(t => !t.concluida).length;
    if (pend > 0) alerts.push({ p: 'ATENÇÃO', t: `Desligamento com ${pend} pendência(s) — ${empName(o.employeeId)}`, m: 'desligamentos', link: `#/colaboradores/${o.employeeId}` });
  });
  const hoje = REF;
  [...empPool.filter(isActiveEmployee), ...(scoped ? [] : DB.contractors.filter(isActiveContractor))].forEach(p => {
    const nome = p.nome || p.razaoSocial;
    if (p.dataNasc) {
      const dn = L.toDate(p.dataNasc);
      if (dn.getUTCMonth() === hoje.getUTCMonth() && dn.getUTCDate() === hoje.getUTCDate()) alerts.push({ p: 'INFORMATIVO', t: `Aniversário hoje — ${nome}`, m: 'aniversariantes', link: '#/aniversariantes' });
    }
  });
  const order = { URGENTE: 0, ATENÇÃO: 1, INFORMATIVO: 2 };
  alerts.sort((a, b) => order[a.p] - order[b.p]);
  return alerts;
}
VIEWS.alertas = function () {
  const alerts = computeAlerts();
  const kindMap = { URGENTE: 'bad', ATENÇÃO: 'warn', INFORMATIVO: 'muted' };
  const rows = alerts.map(a => `<tr class="clickable" data-nav="${a.link}"><td>${badge(a.p, kindMap[a.p])}</td><td>${a.t}</td><td class="muted">${a.m}</td></tr>`);
  return `<div class="page-head"><h1>Central de Alertas</h1><p>${alerts.length} alerta(s) ativo(s), calculados em tempo real.</p></div>
    ${table(['Prioridade', 'Alerta', 'Módulo'], rows)}`;
};

// Impacto financeiro: quanto as horas negativas custam à empresa com base no salário vigente, e o ponto de equilíbrio.
function impactoFinanceiroBancoHoras() {
  const visIds = new Set(visibleEmployees().map(e => e.id));
  const linhas = [];
  visibleEmployees().filter(isActiveEmployee).forEach(e => {
    const lancs = DB.timeBank.filter(t => t.employeeId === e.id);
    if (!lancs.length) return;
    // Preferência: saldo acumulado informado pelo sistema de ponto (importação mais recente); senão, soma do livro local.
    const comSaldoPonto = lancs.filter(t => t.saldoPonto !== undefined && t.saldoPonto !== null).sort((a, b) => (a.data < b.data ? 1 : -1))[0];
    const saldo = comSaldoPonto ? comSaldoPonto.saldoPonto : lancs.reduce((s, t) => s + (t.horas || 0), 0);
    const origem = comSaldoPonto ? 'ponto (importado)' : 'livro do sistema';
    const vig = L.salarioVigente(e.id, REF, DB.salaryHistory);
    const salario = vig ? vig.salario : 0;
    const c = L.custoHorasNegativas(salario, saldo);
    linhas.push({ e, saldo, origem, salario, valorHora: c.valorHora, prejuizo: c.prejuizo || 0, horasDevidas: c.horasDevidas || 0, dias: c.diasParaEquilibrio || 0 });
  });
  if (!linhas.length) return '';
  const negativos = linhas.filter(l => l.saldo < 0).sort((a, b) => b.prejuizo - a.prejuizo);
  const prejuizoTotal = negativos.reduce((s, l) => s + l.prejuizo, 0);
  const creditoTotal = linhas.filter(l => l.saldo > 0).reduce((s, l) => s + l.saldo * l.valorHora, 0);
  const exposicaoLiquida = prejuizoTotal - creditoTotal;
  const cobertura = prejuizoTotal ? Math.min(100, (creditoTotal / prejuizoTotal) * 100) : 100;
  const horasNegTotal = negativos.reduce((s, l) => s + l.horasDevidas, 0);

        ${card('Exposição líquida', L.fmtBRL(exposicaoLiquida), exposicaoLiquida > 0 ? 'negativo supera positivo' : 'positivo cobre o negativo', exposicaoLiquida > 0 ? 'bad' : 'ok')}
        ${card('Cobertura do prejuízo', cobertura.toFixed(0) + '%', 'ponto de equilíbrio da empresa = 100%', cobertura >= 100 ? 'ok' : 'warn')}
      </div>
      <p class="muted" style="margin:10px 0;"><strong>Ponto de equilíbrio</strong> (por colaborador): horas que precisam ser creditadas para o saldo voltar a zero — e em quantos dias, compensando no máximo ${L.HORAS_POR_DIA_PADRAO}h extras/dia. No nível da empresa, o equilíbrio ocorre quando o crédito das horas positivas (linha “cobertura”) chega a 100% do prejuízo.</p>

}

/* ===================== RESCISÃO — prévia determinística (motor da Seção 1 do prompt de rescisão) ===================== */
// Monta, a partir dos dados REAIS já cadastrados (férias, histórico salarial, admissão), a lista de
// períodos a considerar na rescisão: períodos vencidos (concessivo já estourado, saldo pendente) e o
// período proporcional em curso.
function periodosFeriasParaRescisao(employeeId, dataDesligamento) {
  const grupos = agruparFruicoesPorPeriodo(employeeId);
  const out = [];
  const ref = L.toDate(dataDesligamento) || REF;
  Object.entries(grupos).forEach(([aquisitivoInicio, fruicoes]) => {
    if (L.toDate(aquisitivoInicio) > ref) return; // período que só começa depois do desligamento não gera verba
    const consumo = L.consumoPeriodo(fruicoes, ref);
    if (consumo.restante <= 0) return; // já quitado, não entra na rescisão
    const amostra = fruicoes[0];
    const concessivoVencido = amostra.concessivoLimite && L.toDate(amostra.concessivoLimite) < ref;
    out.push({
      aquisitivoInicio, aquisitivoFim: amostra.aquisitivoFim, concessivoLimite: amostra.concessivoLimite,
      status: concessivoVencido ? 'vencidas' : 'proporcionais',
      diasRestantes: Math.round(consumo.restante),
    });
  });
  // período em curso (após o último registrado, ainda sem fruição nenhuma) — se a data de desligamento for depois do último aquisitivoFim
  const chaves = Object.keys(grupos).sort();
  const ultimaChave = chaves[chaves.length - 1];
  const ultimoFim = ultimaChave ? grupos[ultimaChave][0].aquisitivoFim : null;
  if (!ultimaChave || (ultimoFim && L.toDate(ultimoFim) < ref && !out.some(p => p.aquisitivoInicio === ultimaChave))) {
    // não há registro algum ainda cobrindo o período corrente — considera proporcional puro desde o último fim (ou a admissão)
  }
  return out;
}

function tipoAvisoDe(off) {
  if (off.tipoAviso) return off.tipoAviso;
  const t = off.tipoDesligamento || '';
  if (/aviso indenizado/i.test(t)) return 'Indenizado';
  if (/aviso trabalhado/i.test(t)) return 'Trabalhado';
  return null;
}
function badgeStatusRescisao(status) {
  if (status === 'verde') return `${badge('🟢 PRÉVIA COMPLETA', 'ok')}`;
  if (status === 'amarelo') return `${badge('🟡 PRÉVIA PARCIAL', 'warn')}`;
  return `${badge('🔴 REVISÃO NECESSÁRIA', 'bad')}`;
}

  }
  const detId = `mem-${idx}`;
  return `<tr>
    <td>${r.nome}</td><td class="muted">${r.origem}</td><td>${badge('Calculado', 'ok')}</td>

    <td><button type="button" class="btn" data-action="toggle-memoria" data-id="${detId}">Ver memória</button></td>
  </tr>

    <div class="panel" style="background:var(--surface-2); font-size:12.5px;">
      <div><strong>Base utilizada:</strong> <span class="mono">${r.base != null ? L.fmtBRL(r.base) : '—'}</span></div>
      <div><strong>Fórmula:</strong> ${r.formula || '—'}</div>

}

function VIEWS_previaRescisao_renderPrevia(prevista, off, e, versaoCongelada) {
  const linhas = prevista.rubricas.map((r, i) => memoriaRubricaHtml(r, i)).join('');
  const pendencias = prevista.rubricas.filter(r => r.pendente);
  return `
    <div class="panel" style="border-width:2px;">
      <div class="kpi-label">TOTAL DE PROVENTOS CALCULADOS (bruto, antes de INSS/IRRF/FGTS)</div>
      <div class="kpi-value" style="font-size:34px;">${L.fmtBRL(prevista.totalProventos)}</div>
      <div class="kpi-sub">${prevista.rubricas.filter(r => !r.pendente).length} rubrica(s) calculada(s) · ${prevista.rubricas.filter(r => r.pendente).length} pendente(s) — o valor acima NÃO é o líquido a pagar enquanto houver pendências.</div>
    </div>
    <div class="panel" style="margin-top:16px;">
      <h2>Resumo financeiro ${versaoCongelada ? badge(`Versão ${versaoCongelada} — congelada`, 'ok') : badge('Rascunho — ainda não congelado', 'warn')}</h2>
      <p>${badgeStatusRescisao(prevista.status)}</p>
      <div class="kpi-grid">
        ${card('Total de proventos calculados', L.fmtBRL(prevista.totalProventos), `${prevista.rubricas.filter(r => !r.pendente).length} rubrica(s) calculada(s)`)}
        ${card('Pendências', pendencias.length, 'ver lista abaixo — nunca tratadas como R$ 0,00', pendencias.length ? 'warn' : 'ok')}
        ${card('Aviso-prévio', prevista.diasAviso != null ? prevista.diasAviso + ' dia(s)' : '—', '30 + 3/ano completo, teto 90')}
      </div>
      <p class="muted" style="margin-top:10px;">FGTS, INSS, IRRF, médias de comissão/hora extra e descontos aparecem como <strong>pendentes</strong> porque este protótipo não tem a base oficial (extrato FGTS, tabelas vigentes, CCT parametrizada, histórico de competências). Isso é proposital — o sistema nunca mostra R$ 0,00 quando falta informação.</p>
    </div>
    <section class="panel" style="margin-top:16px;">
      <h2>Memória de cálculo, rubrica por rubrica</h2>
      <div class="table-wrap"><table class="table"><thead><tr><th>Rubrica</th><th>Origem</th><th>Status</th><th>Valor</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>
    </section>
    ${!versaoCongelada ? `<div class="panel-actions" style="margin-top:16px;"><button class="btn btn-primary" data-action="congelar-rescisao" data-id="${off.id}">Congelar cálculo (gerar versão ${DB.rescisoes.filter(r => r.offboardingId === off.id).length + 1})</button></div>` : ''}
  `;

VIEWS.previaRescisao = function (offId) {
  const off = DB.offboardings.find(o => String(o.id) === String(offId));
  if (!off) return `<div class="empty">Processo de desligamento não encontrado.</div>`;
  const e = DB.employees.find(x => x.id === off.employeeId);
  if (!canViewEmployee(e)) return restrictedEmployeeView();
  const vig = L.salarioVigente(e.id, L.toDate(off.dataPrevista) || REF, DB.salaryHistory);
  const versoes = DB.rescisoes.filter(r => r.offboardingId === off.id).sort((a, b) => b.versao - a.versao);
  const ultimaCongelada = versoes[0];

  const cabecalho = `
    <div class="page-head"><a href="#/desligamentos" class="breadcrumb">← Desligamentos</a>
      <h1>Prévia de Rescisão — ${e.nome}</h1>
      <p>${e.cargo} · Admissão ${L.fmtDateBR(e.dataAdmissao)} · Salário vigente ${L.fmtBRL(vig ? vig.salario : null)} · Tipo: ${off.tipoDesligamento || off.motivo} ${off.tipoAviso ? '· Aviso ' + off.tipoAviso : ''} · Data prevista ${L.fmtDateBR(off.dataPrevista)}</p></div>`;

  if (versoes.length > 1) {
    var historicoHtml = `<section class="panel" style="margin-bottom:16px;"><h2>Histórico de versões</h2>${table(['Versão', 'Congelada em', 'Total proventos', 'Status'], versoes.map(v => `<tr><td class="mono">v${v.versao}</td><td class="mono">${L.fmtDateBR(v.congeladoEm)}</td><td class="mono">${L.fmtBRL(v.resultado.totalProventos)}</td><td>${badgeStatusRescisao(v.resultado.status)}</td></tr>`))}</section>`;
  }

  if (!vig) {
    return cabecalho + `<div class="empty">Não há salário vigente cadastrado para este colaborador — não é possível calcular a prévia.</div>`;
  }
  if (!off.tipoDesligamento || !off.dataComunicacao) {
    return cabecalho + `<section class="panel"><h2>Complete os dados para calcular</h2>
      <p class="muted">Este processo foi aberto antes de o tipo de desligamento e a data de comunicação serem exigidos. Informe-os para liberar o cálculo — nada do que já foi registrado é perdido.</p>
      <button class="btn btn-primary" data-action="completar-dados-desligamento" data-id="${off.id}">Informar tipo de desligamento e data de comunicação</button></section>`;
  }
  const modalidadeOk = /CLT|Dispensa|demissão|experiência/i.test(off.tipoDesligamento) || true; // todos os colaboradores aqui são CLT
  if (!modalidadeOk) {
    return cabecalho + `<div class="empty">Modalidade ainda não parametrizada para cálculo automático.</div>`;
  }

  const periodosFerias = periodosFeriasParaRescisao(e.id, off.dataPrevista);
  const tipoAvisoEfetivo = tipoAvisoDe(off);
  const base = { employee: e, salarioVigenteValor: vig.salario, tipoDesligamento: off.tipoDesligamento, dataComunicacao: off.dataComunicacao, dataDesligamento: off.dataPrevista, periodosFerias };

  let corpoHtml;
  const ehDispensaSemJusta = /Dispensa sem justa causa/i.test(off.tipoDesligamento);

  if (ultimaCongelada) {
    corpoHtml = VIEWS_previaRescisao_renderPrevia(ultimaCongelada.resultado, off, e, ultimaCongelada.versao);
  } else if (ehDispensaSemJusta) {
    const trabalhado = L.montarPreviaRescisao({ ...base, tipoAviso: 'Trabalhado' });
    const indenizado = L.montarPreviaRescisao({ ...base, tipoAviso: 'Indenizado' });
    const diferenca = L.round2(indenizado.totalProventos - trabalhado.totalProventos);
    corpoHtml = `
      <section class="panel">
        <h2>Comparação de cenários</h2>
        <p class="muted">Compare antes de escolher o tipo de aviso definitivo (aviso definido: "${tipoAvisoEfetivo || 'não definido'}").</p>
        <div class="two-col">
          <div class="kpi"><div class="kpi-label">Aviso trabalhado</div><div class="kpi-value">${L.fmtBRL(trabalhado.totalProventos)}</div></div>
          <div class="kpi"><div class="kpi-label">Aviso indenizado</div><div class="kpi-value">${L.fmtBRL(indenizado.totalProventos)}</div></div>
        </div>
        <p style="margin-top:10px;"><strong>Diferença financeira:</strong> <span class="mono">${L.fmtBRL(Math.abs(diferenca))}</span> ${diferenca > 0 ? '(indenizado é mais caro)' : diferenca < 0 ? '(trabalhado é mais caro)' : '(empate)'} — considerando só proventos calculados; FGTS/INSS/IRRF ficam pendentes nos dois cenários.</p>
      </section>
      <div style="margin-top:16px;">${VIEWS_previaRescisao_renderPrevia(tipoAvisoEfetivo === 'Trabalhado' ? trabalhado : indenizado, off, e, null)}</div>`;
  } else {
    const prevista = L.montarPreviaRescisao({ ...base, tipoAviso: tipoAvisoEfetivo });
    corpoHtml = VIEWS_previaRescisao_renderPrevia(prevista, off, e, null);
  }

  return cabecalho + (historicoHtml || '') + corpoHtml;
};

      <ul>
