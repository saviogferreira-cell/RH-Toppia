        <li>Recálculo em tempo real das regras da planilha: Vale Alimentação por tempo de casa, INSS estimado, período de experiência, status de exames, período aquisitivo/concessivo de férias e comissão PJ por faixa de vendas.</li>
        <li>Central de Pendências (agenda diária), Central de Alertas e Aniversariantes, todos derivados dinamicamente.</li>
        <li><strong>Admissões</strong> — funil de pré-admissão com as etapas da diretriz; a efetivação como CLT exige salário inicial positivo.</li>
        <li><strong>Documentos</strong> — catálogo de tipos (pessoal, complementar, admissional para assinatura) e status por colaborador, com "enviado" tratado como diferente de "aprovado".</li>
        <li><strong>Movimentações</strong> — log estruturado (cargo, setor, gestor, jornada, estabelecimento), sempre em modo apenas-acréscimo, igual ao Histórico Salarial.</li>
        <li><strong>Afastamentos</strong> e <strong>Banco de Horas</strong> (livro de lançamentos, saldo sempre calculado — nunca um campo editável direto).</li>
        <li><strong>Desligamento em workflow</strong>, com checklist de tarefas por área e indicador de progresso.</li>
        <li><strong>TIP</strong> e <strong>SST</strong> — telas e catálogos prontos, propositalmente vazios até o RH/SST alimentar a trilha e a matriz reais.</li>
        <li>Perfis de acesso mais granulares (Administrador, RH Administrador, RH Operacional, DP/Contabilidade, SST, Gestor, Financeiro, Colaborador), com menus filtrados por perfil.</li>
      </ul>
      <h3>Limitações importantes desta entrega</h3>
      <ul>
        <li><strong>Não há backend, banco de dados real nem autenticação segura.</strong> Os dados ficam apenas no armazenamento local deste navegador. A troca de perfil no topo é uma simulação para demonstrar o RBAC, não um login real.</li>
        <li><strong>Salvamento local</strong> — quando o navegador recusa a gravação, o sistema avisa e mantém os dados apenas na aba aberta para nova tentativa. Isso não substitui backup nem garante recuperação após fechar o navegador.</li>
        <li><strong>TIP e matriz SST propositalmente vazios</strong> — cadastrar a trilha de treinamento e a matriz cargo/GHE × NR exige o conteúdo real do RH e do PGR/PCMSO; nada foi suposto, conforme pedido explicitamente na diretriz.</li>
        <li>Recrutamento e Seleção, avaliação de desempenho com autenticação e compartilhamento em servidor, assinatura eletrônica real, integração eSocial e importação automática da folha da contabilidade continuam como próximos passos de backend (não implementados neste protótipo front-end).</li>
        <li>O cálculo de INSS é o mesmo aproximado já usado na planilha — mantido assim de propósito, não deve ser usado como cálculo trabalhista oficial. A folha oficial é sempre a da contabilidade/DP.</li>
        <li>As duas inconsistências do diagnóstico original (lançamentos de folha duplicados em 09/2026 e o e-mail duplicado entre dois colaboradores) seguem preservadas, sem correção automática.</li>
      </ul>
      <p>Próximo passo real de produção: banco de dados compartilhado (PostgreSQL, conforme a diretriz), autenticação segura, upload de documentos e as integrações externas — Fase 3 em diante do roadmap.</p>
    </section>`;
};


</script>
<script>

/* ===================== MODAL INFORMATIVO (sem formulário) ===================== */
function openInfoModal(title, bodyHtml) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <div class="modal-head"><h3>${title}</h3><button class="modal-close" id="modal-close">✕</button></div>
        <div style="padding: 18px 20px;">${bodyHtml}
          <div class="modal-actions"><button type="button" class="btn btn-primary" id="modal-ok">Entendi</button></div>
        </div>
      </div>
    </div>`;
  const close = () => { root.innerHTML = ''; };
  document.getElementById('modal-close').addEventListener('click', close);
  document.getElementById('modal-ok').addEventListener('click', close);
  document.getElementById('modal-backdrop').addEventListener('click', (e) => { if (e.target.id === 'modal-backdrop') close(); });
}

/* ===================== MODAL GENÉRICO ===================== */
function openModal(title, bodyHtml, onSubmit) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <div class="modal-head"><h3>${title}</h3><button class="modal-close" id="modal-close">✕</button></div>
        <form id="modal-form">${bodyHtml}
          <div class="modal-actions"><button type="button" class="btn" id="modal-cancel">Cancelar</button><button type="submit" class="btn btn-primary" id="modal-submit">Salvar</button></div>
        </form>
      </div>
    </div>`;
  const close = () => { root.innerHTML = ''; };
  document.getElementById('modal-close').addEventListener('click', close);
  document.getElementById('modal-cancel').addEventListener('click', close);
  document.getElementById('modal-backdrop').addEventListener('click', (e) => { if (e.target.id === 'modal-backdrop') close(); });
  const modalForm = document.getElementById('modal-form');
  const saveCopyButton = modalForm.querySelector('[data-save-copy]');
  if (saveCopyButton) {
    const fileInput = modalForm.querySelector('input[type="file"][name="arquivo"]');
    const confirmation = modalForm.querySelector('[data-save-confirm]');
    fileInput.addEventListener('change', () => { confirmation.checked = false; confirmation.disabled = true; });
    saveCopyButton.addEventListener('click', () => {
      if (!fileInput.files || !fileInput.files[0]) { alert('Escolha o arquivo antes de salvar a cópia.'); return; }
      try { prepararCopiaParaSalvar(fileInput.files[0], modalForm); confirmation.disabled = false; }
      catch (err) { alert('Não foi possível iniciar o download: ' + err.message); }
    });
  }
  modalForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (saveCopyButton) {
      const fileInput = modalForm.querySelector('input[type="file"][name="arquivo"]');
      const confirmation = modalForm.querySelector('[data-save-confirm]');
      if (!fileInput.files || !fileInput.files[0] || confirmation.disabled || !confirmation.checked) {
        alert('Salve a cópia, confira o download e confirme antes de registrar o nome do arquivo.'); return;
      }
    }
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    const submitBtn = document.getElementById('modal-submit');
    try {
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Processando…'; }
      if (!modalForm.dataset.awaitingSave) {
        const result = await onSubmit(data);
        if (result === false) { if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Salvar'; } return; }
        // Se o armazenamento falhar, não execute onSubmit duas vezes ao tentar salvar novamente.
        modalForm.dataset.awaitingSave = 'true';
      }
      saveDB();
      close();
      render();
    } catch (err) {
      console.error(err);
      alert('Não foi possível salvar: ' + (err && err.message ? err.message : err));
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = modalForm.dataset.awaitingSave ? 'Tentar salvar novamente' : 'Salvar'; }
    }
  });
}
function field(label, name, type, opts) {
  opts = opts || {};
  if (type === 'select') {
    return `<label class="field"><span>${label}${opts.required ? ' *' : ''}</span><select name="${name}" ${opts.required ? 'required' : ''}>${opts.options.map(o => `<option value="${o.v}" ${opts.value === o.v ? 'selected' : ''}>${o.l}</option>`).join('')}</select></label>`;
  }
  if (type === 'file') {
    return `<label class="field"><span>${label}${opts.required ? ' *' : ''}</span><input type="file" name="${name}" ${opts.accept ? `accept="${opts.accept}"` : ''} ${opts.required ? 'required' : ''} /></label>`;
  }
  return `<label class="field"><span>${label}${opts.required ? ' *' : ''}</span><input type="${type}" name="${name}" ${opts.required ? 'required' : ''} ${opts.step ? `step="${opts.step}"` : ''} value="${opts.value != null ? opts.value : ''}" /></label>`;
}

/* ===================== FÉRIAS: formulário unificado (nova solicitação OU confirmação de período pendente) ===================== */
function construirFruicoesDaForma(forma, inicio, inicio2, ciclo) {
  const base = { aquisitivoInicio: ciclo.aquisitivoInicio, aquisitivoFim: ciclo.aquisitivoFim, concessivoLimite: ciclo.concessivoLimite, aprovadoPor: null, solicitou13: 'Não', avisoEmitido: 'Não', avisoAnexoNome: null, avisoAnexoData: null, reciboAnexoNome: null, reciboAnexoData: null, observacoesRH: null };
  if (forma === '30-corridos') {
    return [{ ...base, formaUtilizacao: forma, inicioFerias: inicio, diasGozo: 30, diasAbono: 0, statusFruicao: 'Confirmado', statusAprovacao: 'Aprovado' }];
  }
  if (forma === '20-abono') {
    return [{ ...base, formaUtilizacao: forma, inicioFerias: inicio, diasGozo: 20, diasAbono: 10, statusFruicao: 'Confirmado', statusAprovacao: 'Aprovado' }];
  }
  // 20 dias agora + 10 dias em outro período, vinculados ao mesmo período aquisitivo
  return [
    { ...base, formaUtilizacao: forma, inicioFerias: inicio, diasGozo: 20, diasAbono: 0, statusFruicao: 'Confirmado', statusAprovacao: 'Aprovado' },
    { ...base, formaUtilizacao: forma, inicioFerias: inicio2 || null, diasGozo: 10, diasAbono: 0, statusFruicao: 'Pendente', statusAprovacao: 'Pendente', observacoesRH: 'Segundo período do mesmo período aquisitivo — data sugerida, aguardando confirmação.' },
  ];
}
function abrirFormularioFerias(e, stub) {
  const ciclo = stub ? { aquisitivoInicio: stub.aquisitivoInicio, aquisitivoFim: stub.aquisitivoFim, concessivoLimite: stub.concessivoLimite } : L.cicloAquisitivo(e.dataAdmissao, REF);
  if (!ciclo) { alert('Não foi possível calcular o período aquisitivo (verifique a data de admissão).'); return; }
  openModal(stub ? `Definir próximo período de férias — ${e.nome}` : `Programar férias — ${e.nome}`, `
    <p class="muted">Período aquisitivo: <strong>${L.fmtDateBR(ciclo.aquisitivoInicio)} – ${L.fmtDateBR(ciclo.aquisitivoFim)}</strong> · limite do período concessivo: <strong>${L.fmtDateBR(ciclo.concessivoLimite)}</strong></p>
    ${field('Forma de utilização', 'forma', 'select', { required: true, options: [
      { v: '30-corridos', l: '30 dias corridos de férias' },
      { v: '20-abono', l: '20 dias de férias + venda de 10 dias (abono pecuniário)' },
      { v: '20-mais-10', l: '20 dias de férias + 10 dias em outro período' },
    ] })}
    ${field('Início do período', 'inicio', 'date', { required: true })}
    <div id="campo-segunda-data" class="hidden">${field('Data prevista para os 10 dias restantes', 'inicio2', 'date', {})}</div>
  `, (data) => {
    if (data.forma === '20-mais-10' && !data.inicio2) { alert('Informe a data prevista para os 10 dias restantes (pode ajustar depois).'); return false; }
    const registros = construirFruicoesDaForma(data.forma, data.inicio, data.inicio2, ciclo);
    // Reservas futuras e o segundo período pendente também ocupam dias do mesmo ciclo.
    // Ao preencher um stub automático ele é substituído, não somado duas vezes.
    const reservados = DB.vacations.filter(v => v.employeeId === e.id && v !== stub && v.statusFruicao !== 'Cancelado' && v.aquisitivoInicio === ciclo.aquisitivoInicio)
      .reduce((sum, v) => sum + (Number(v.diasGozo) || 0) + (Number(v.diasAbono) || 0), 0);
    const solicitados = registros.reduce((sum, v) => sum + (Number(v.diasGozo) || 0) + (Number(v.diasAbono) || 0), 0);
    if (reservados + solicitados > L.DIAS_DIREITO_FERIAS) {
      alert(`Este período aquisitivo já tem ${reservados} dia(s) reservados/usados. Restam ${Math.max(0, L.DIAS_DIREITO_FERIAS - reservados)} de ${L.DIAS_DIREITO_FERIAS}; esta programação solicita ${solicitados}. Confira os registros antes de continuar.`);
      return false;
    }
    if (stub) {
      Object.assign(stub, registros[0]);
      for (let i = 1; i < registros.length; i++) DB.vacations.push({ id: nextId('vacations'), employeeId: e.id, ...registros[i] });
    } else {
      registros.forEach(r => DB.vacations.push({ id: nextId('vacations'), employeeId: e.id, ...r }));
    }
    reconciliarFerias();
  });
  setTimeout(() => {
    const form = document.getElementById('modal-form');
    if (!form) return;
    const formaSel = form.querySelector('select[name="forma"]');
    const bloco2 = document.getElementById('campo-segunda-data');
    const inicioInput = form.querySelector('input[name="inicio"]');
    const inicio2Input = form.querySelector('input[name="inicio2"]');
    function atualizar() { bloco2.classList.toggle('hidden', formaSel.value !== '20-mais-10'); }
    formaSel.addEventListener('change', atualizar);
    inicioInput.addEventListener('change', () => {
      if (formaSel.value === '20-mais-10' && inicioInput.value && !inicio2Input.value) {
        inicio2Input.value = L.fmtDate(L.addMonths(L.toDate(inicioInput.value), 6));
      }
    });
    atualizar();
  }, 0);
}

/* ===================== BANCO DE HORAS: importação do extrato em PDF (Control iD e similares) ===================== */
function docStorageNote() {
  return `<p class="muted" style="font-size:12px;">O arquivo não é armazenado neste sistema. Use “Salvar cópia” e escolha o destino no navegador; confirme que o download foi concluído antes de registrar o nome aqui. Para escolher a pasta a cada arquivo, ative a opção “Perguntar onde salvar cada arquivo” nas configurações de downloads do navegador.</p>`;
}
function controlesSalvarCopia() {
  return `<div><button type="button" class="btn" data-save-copy>Salvar cópia do arquivo</button>
    <p class="muted" data-save-status aria-live="polite" style="font-size:12px;"></p>
    <label class="field" style="flex-direction:row; align-items:start;"><input type="checkbox" data-save-confirm disabled required /> Confirme que o arquivo foi salvo no destino escolhido. Somente o nome será registrado neste sistema.</label></div>`;
}
function prepararCopiaParaSalvar(file, form) {
  if (!(file instanceof File)) throw new Error('Selecione um arquivo válido.');
  const url = URL.createObjectURL(file);
  const link = document.createElement('a');
  link.href = url;
  link.download = file.name;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  const status = form.querySelector('[data-save-status]');
  if (status) status.textContent = `Download solicitado para ${file.name}. Confira se a cópia foi salva antes de confirmar.`;
}

async function extrairExtratoBancoHoras(arrayBuffer, onProgress) {
  if (typeof pdfjsLib === 'undefined') throw new Error('Leitor de PDF não carregou (verifique a conexão com a internet e recarregue).');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const registros = [];
  let ignoradas = 0;
  for (let i = 1; i <= pdf.numPages; i++) {
    if (onProgress) onProgress(`Lendo página ${i} de ${pdf.numPages}…`);
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const texto = content.items.map(it => it.str).join(' ');
    const reg = L.parseExtratoPagina(texto);
    if (reg) registros.push(reg); else ignoradas++;
  }
  return { registros, ignoradas, totalPaginas: pdf.numPages };
}

function abrirImportacaoBancoHoras() {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal" style="max-width:780px;">
        <div class="modal-head"><h3>Importar extrato de Banco de Horas (PDF)</h3><button class="modal-close" id="modal-close">✕</button></div>
        <div id="import-body" style="padding:18px 20px;">
          <p class="muted">Envie o PDF “Extrato Banco Horas” exatamente como sai do sistema de ponto (uma página por colaborador). O sistema lê nome, período, total do período e saldo, e mostra uma prévia para você conferir antes de gravar.</p>
          <label class="field"><span>Arquivo PDF *</span><input type="file" id="import-pdf-input" accept=".pdf,application/pdf" /></label>
          <p class="muted" style="font-size:12px;">Este relatório já foi escolhido no seu computador. A importação grava os lançamentos de horas, mas não arquiva o PDF; mantenha o original onde desejar.</p>
          <div id="import-status" class="muted" style="margin-top:10px;"></div>
        </div>
      </div>
    </div>`;
  const close = () => { root.innerHTML = ''; };
  document.getElementById('modal-close').addEventListener('click', close);
  document.getElementById('modal-backdrop').addEventListener('click', (e) => { if (e.target.id === 'modal-backdrop') close(); });
  document.getElementById('import-pdf-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const statusEl = document.getElementById('import-status');
    statusEl.textContent = 'Lendo arquivo…';
    try {
      const buf = await file.arrayBuffer();
      const { registros, ignoradas, totalPaginas } = await extrairExtratoBancoHoras(buf, (m) => { statusEl.textContent = m; });
      if (!registros.length) { statusEl.textContent = `Nenhum colaborador reconhecido nas ${totalPaginas} página(s). Confirme se é o “Extrato Banco Horas”.`; return; }
      renderPreviaImportacao(registros, ignoradas, file.name, close);
    } catch (err) {
      statusEl.textContent = 'Erro ao ler o PDF: ' + err.message;
    }
  });
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function renderPreviaImportacao(registros, ignoradas, nomeArquivo, close) {
  const periodos = [...new Set(registros.map(r => `${r.periodoInicio || ''}|${r.periodoFim || ''}`))];
  const periodoMisto = periodos.length > 1;
  const linhas = registros.map((r, i) => {
    const exato = L.encontrarColaboradorPorNome(r.nome, DB.employees);
    const sugerido = exato ? null : L.sugerirColaborador(r.nome, DB.employees);
    const pre = exato || sugerido;
    const dataLanc = r.periodoFim || L.fmtDate(REF);
    const duplicado = !!(pre && DB.timeBank.some(t => Number(t.employeeId) === Number(pre.id) && t.data === dataLanc && /Importação de ponto \(PDF\)/i.test(t.origem || '')));
    const opts = `<option value="">— não importar —</option>` + DB.employees.slice().sort((x, y) => x.nome.localeCompare(y.nome)).map(e => `<option value="${e.id}" ${pre && pre.id === e.id ? 'selected' : ''}>${escapeHtml(e.nome)}${e.status === 'Inativo' ? ' (inativo)' : ''}</option>`).join('');
    const situacao = duplicado ? badge('Já importado neste período', 'muted') : exato ? badge('Encontrado', 'ok') : sugerido ? badge('Aproximado — confira', 'warn') : badge('Não encontrado', 'bad');
    const fmt = h => `${h >= 0 ? '+' : '−'}${Math.abs(Number(h) || 0).toFixed(2)}h`;
    return `<tr data-duplicate="${duplicado ? 'true' : 'false'}"><td>${escapeHtml(r.nome)}</td><td class="mono">${escapeHtml(r.periodoInicio ? L.fmtDateBR(r.periodoInicio) : '—')} a ${escapeHtml(r.periodoFim ? L.fmtDateBR(r.periodoFim) : '—')}</td><td class="mono">${fmt(r.bancoTotal)}</td><td class="mono">${fmt(r.bancoPositivo)}</td><td class="mono">${fmt(r.bancoNegativo)}</td><td class="mono">${fmt(r.bancoAjuste)}</td><td class="mono">${fmt(r.bancoSaldo)}</td><td>${situacao}</td><td><select data-idx="${i}" class="select-filter" style="max-width:220px;" ${duplicado ? 'disabled' : ''}>${opts}</select></td></tr>`;
  }).join('');
  const per = registros[0] || {};
  document.getElementById('import-body').innerHTML = `
    <p class="muted">Arquivo <strong>${escapeHtml(nomeArquivo)}</strong> · período do relatório: <strong>${per.periodoInicio ? L.fmtDateBR(per.periodoInicio) : '—'} a ${per.periodoFim ? L.fmtDateBR(per.periodoFim) : '—'}</strong> · ${registros.length} colaborador(es) lido(s)${ignoradas ? ` · ${ignoradas} página(s) sem dados reconhecíveis` : ''}${periodoMisto ? ' · <strong>atenção: há períodos diferentes no mesmo arquivo</strong>' : ''}.</p>
    <p class="muted" style="font-size:12px;">A importação grava o <strong>Banco Total do período</strong> como movimentação do período; positivo, negativo, ajuste e saldo acumulado do ponto são preservados na justificativa. O saldo acumulado do ponto não substitui o saldo calculado no aplicativo. Confira a associação de nomes; registros já importados para o mesmo colaborador e período são bloqueados.</p>
    <div class="table-wrap" style="max-height:380px; overflow:auto;"><table class="table"><thead><tr><th>Colaborador no relatório</th><th>Período</th><th>Total</th><th>Positivo</th><th>Negativo</th><th>Ajuste</th><th>Saldo ponto</th><th>Correspondência</th><th>Colaborador no sistema</th></tr></thead><tbody>${linhas}</tbody></table></div>
    <div class="modal-actions" style="margin-top:14px;"><button type="button" class="btn" id="import-cancel">Cancelar</button><button type="button" class="btn btn-primary" id="import-confirm">Confirmar importação</button></div>`;
  document.getElementById('import-cancel').addEventListener('click', close);
  document.getElementById('import-confirm').addEventListener('click', () => {
    let importados = 0, pulados = 0, duplicados = 0;
    const selects = document.querySelectorAll('#import-body select[data-idx]');
    const selecionados = new Set();
    selects.forEach(sel => {
      const tr = sel.closest('tr');
      if (tr && tr.dataset.duplicate === 'true') { duplicados++; return; }
      const r = registros[Number(sel.dataset.idx)];
      const empId = Number(sel.value);
      if (!empId) { pulados++; return; }
      if (selecionados.has(empId)) { pulados++; return; }
      selecionados.add(empId);
      const dataLanc = r.periodoFim || L.fmtDate(REF);
      if (DB.timeBank.some(t => Number(t.employeeId) === empId && t.data === dataLanc && /Importação de ponto \(PDF\)/i.test(t.origem || ''))) { duplicados++; return; }
      const fmt = h => (h >= 0 ? '+' : '−') + Math.abs(Number(h) || 0).toFixed(2) + 'h';
      const justificativa = `Período ${r.periodoInicio ? L.fmtDateBR(r.periodoInicio) : '?'} a ${r.periodoFim ? L.fmtDateBR(r.periodoFim) : '?'} · banco total ${fmt(r.bancoTotal)} · positivo ${fmt(r.bancoPositivo)} · negativo ${fmt(r.bancoNegativo)} · ajuste ${fmt(r.bancoAjuste)} · saldo acumulado no ponto ${fmt(r.bancoSaldo)} · arquivo ${nomeArquivo}`;
      DB.timeBank.push({ id: nextId('timeBank'), employeeId: empId, data: dataLanc, origem: 'Importação de ponto (PDF)', horas: r.bancoTotal, justificativa, competencia: L.competenciaBancoHoras(dataLanc), saldoPonto: r.bancoSaldo, bancoPositivo: r.bancoPositivo, bancoNegativo: r.bancoNegativo, bancoAjuste: r.bancoAjuste, periodoInicio: r.periodoInicio, periodoFim: r.periodoFim, arquivoOrigem: nomeArquivo });
      importados++;
    });
    saveDB(); close(); render();
    alert(`Importação concluída: ${importados} lançamento(s) gravado(s)${duplicados ? `, ${duplicados} duplicado(s) ignorado(s)` : ''}${pulados ? `, ${pulados} linha(s) não importada(s) (sem associação ou colaborador repetido)` : ''}.`);
  });
}

/* ===================== AÇÕES ===================== */
function wireViewEvents() {
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => { location.hash = el.dataset.nav; render(); });
  });
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const action = el.dataset.action;
      const id = el.dataset.id;
      ACTIONS[action] && ACTIONS[action](id);
    });
  });
  const filtroColab = document.getElementById('filtro-colab-status');
  if (filtroColab) filtroColab.addEventListener('change', (e) => { LIST_FILTERS.colaboradores = e.target.value; render(); });
  const filtroContrat = document.getElementById('filtro-contrat-status');
  if (filtroContrat) filtroContrat.addEventListener('change', (e) => { LIST_FILTERS.contratados = e.target.value; render(); });
  const filtroComp = document.getElementById('filtro-competencia-horas');
  if (filtroComp) filtroComp.addEventListener('change', (e) => { LIST_FILTERS.bancoHorasCompetencia = e.target.value; render(); });
}

  'avancar-estagio': (id) => {
    const a = DB.admissions.find(x => String(x.id) === String(id));
    if (!a) { alert('Pré-admissão não encontrada.'); return; }
    const idx = ADMISSION_STAGES.indexOf(a.stage);
    if (idx < 0 || idx >= ADMISSION_STAGES.length - 1) {
      alert('Não há uma próxima etapa válida para esta pré-admissão.'); return;
    }
    const proxima = ADMISSION_STAGES[idx + 1];
    openModal(`Avançar: ${a.stage} → ${proxima}`, `
      <p class="muted">Registre o que foi feito nesta etapa ou informe uma referência de evidência. O arquivo em si não é armazenado neste protótipo.</p>
      ${proxima === 'Ativo' && !a.employeeId ? `<label class="field"><span>Salário inicial (R$) *</span><input name="salarioInicial" type="number" min="0.01" step="0.01" required placeholder="Ex.: 2500.00"></label>` : ''}

      ${field('Referência de evidência (nome do arquivo ou protocolo)', 'evidencia', 'text', {})}
      <p class="muted" style="font-size:12px;">Preencha ao menos um dos campos. A referência não anexa nem valida o arquivo; guarde o original no local definido pelo RH.</p>
    `, (data) => {
      const registro = String(data.registro || '').trim();
      const evidencia = String(data.evidencia || '').trim();
      if (!registro && !evidencia) {
        alert('Para avançar, descreva o que foi feito ou informe a referência de uma evidência.');
        return false;
      }
      // Confere novamente o estágio ao salvar: apenas uma transição adjacente por confirmação.
      if (a.stage !== ADMISSION_STAGES[idx]) {
        alert('A etapa mudou. Atualize a tela antes de avançar.');
        return false;
      }
      const salarioInicial = Number(data.salarioInicial);
      if (proxima === 'Ativo' && !a.employeeId && (!Number.isFinite(salarioInicial) || salarioInicial <= 0 || !/^\d+(?:\.\d{1,2})?$/.test(String(data.salarioInicial || '')))) {
        alert('Informe um salário inicial positivo, com no máximo duas casas decimais, para ativar o colaborador.');
        return false;

      if (!Array.isArray(a.historicoEtapas)) a.historicoEtapas = [];
      a.historicoEtapas.push({ de: a.stage, para: proxima, registro, evidencia, data: new Date().toLocaleString('pt-BR') });
      a.stage = proxima;
      if (proxima === 'Ativo' && !a.employeeId) {
        const empId = nextPersonId();
        DB.employees.push({ id: empId, nome: a.nome, cpf: a.cpf, cargo: a.cargo, departamento: a.departamento, empresa: a.empresa, estabelecimento: null, dataAdmissao: a.dataPrevista, status: 'Ativo', statusWorkflow: 'Ativo', dataNasc: null, email: null, telefone: null, gestor: null, genero: null, nivel: null, matricula: null, optanteVT: 'Não', dataDesligamento: null, observacoes: 'Efetivado via workflow de pré-admissão', vaFixoOverride: null });

        a.employeeId = empId;
      }
    });

      DB.contractors.push({ id, razaoSocial: data.razaoSocial, cnpj: data.cnpj, servico: data.servico, dataInicio: data.dataInicio, valorFixoMensal: Number(data.valorFixoMensal), email: data.email || null, telefone: data.telefone || null, pix: data.pix || null, status: 'Ativo', dataNasc: null, observacoes: null });
    });
  },

  'nova-vigencia': (id) => {
    const e = DB.employees.find(x => String(x.id) === String(id));
    openModal(`Novo salário — ${e.nome}`, `
      <p class="muted">A vigência atual será encerrada automaticamente um dia antes do novo início. Se o cargo mudar aqui, o cadastro do colaborador é atualizado junto.</p>
      ${field('Novo salário (R$)', 'salario', 'number', { required: true, step: '0.01' })}
      ${field('Cargo', 'cargo', 'text', { required: true, value: e.cargo })}
      ${field('Início da vigência', 'inicio', 'date', { required: true })}
      ${field('Motivo', 'motivo', 'select', { required: true, options: ['Promoção', 'Mudança de cargo', 'Aumento por mérito', 'Reajuste anual / Dissídio', 'Equiparação salarial', 'Acordo coletivo', 'Ajuste de função', 'Redução salarial acordada', 'Outros'].map(m => ({ v: m, l: m })) })}
    `, (data) => {
      const atual = L.salarioVigente(e.id, L.toDate(data.inicio), DB.salaryHistory);
      if (atual && !atual.fimVigencia) atual.fimVigencia = L.fmtDate(L.addDays(L.toDate(data.inicio), -1));
      DB.salaryHistory.push({ id: nextId('salaryHistory'), employeeId: e.id, salario: Number(data.salario), cargo: data.cargo, inicioVigencia: data.inicio, fimVigencia: null, motivo: data.motivo });
      if (data.cargo && data.cargo !== e.cargo) {
        DB.movements.push({ id: nextId('movements'), employeeId: e.id, tipo: 'Mudança de cargo', campo: 'cargo', valorAnterior: e.cargo, valorNovo: data.cargo, data: data.inicio, motivo: `Registrado junto ao histórico salarial (${data.motivo})` });
        e.cargo = data.cargo;
      }
    });
  },

  'novo-exame': (id) => {
    openModal('Registrar exame ocupacional', `
      ${field('Tipo de exame', 'tipo', 'select', { required: true, options: [{ v: 'Admissional', l: 'Admissional' }, { v: 'Periódico Anual', l: 'Periódico Anual' }, { v: 'Demissional', l: 'Demissional' }, { v: 'Mudança de Função', l: 'Mudança de Função' }] })}
      ${field('Data de realização', 'data', 'date', { required: true })}
      ${field('Validade (meses)', 'validade', 'number', { required: true, value: 12 })}
      ${field('Responsável', 'responsavel', 'text', {})}
    `, (data) => {
      DB.exams.push({ id: nextId('exams'), employeeId: Number(id), tipo: data.tipo, dataRealizacao: data.data, validadeMeses: Number(data.validade), responsavel: data.responsavel || null, observacoes: null });
    });
  },

  /* ===== FÉRIAS: forma de utilização, quitação por período aquisitivo, aviso/recibo ===== */
  'nova-ferias': (id) => {
    const e = DB.employees.find(x => String(x.id) === String(id));
    abrirFormularioFerias(e, null);
  },

  'confirmar-ferias-pendente': (fruicaoId) => {
    const f = DB.vacations.find(x => String(x.id) === String(fruicaoId));
    const e = DB.employees.find(x => x.id === f.employeeId);
    const jaTemDias = !!f.diasGozo || !!f.diasAbono;
    if (jaTemDias) {
      // segundo período de um "20 + 10 em outra data": só falta confirmar/ajustar a data
      openModal(`Confirmar data — ${e.nome}`, `
        <p class="muted">Segundo período do mesmo período aquisitivo (${L.fmtDateBR(f.aquisitivoInicio)} – ${L.fmtDateBR(f.aquisitivoFim)}). ${f.diasGozo} dia(s) de gozo.</p>
        ${field('Data de início', 'inicio', 'date', { required: true, value: f.inicioFerias || '' })}
      `, (data) => {
        f.inicioFerias = data.inicio;
        f.statusFruicao = 'Confirmado';
        f.statusAprovacao = 'Aprovado';
        reconciliarFerias();
      });
    } else {
      // período novo gerado automaticamente após quitação: pede a forma de utilização completa
      abrirFormularioFerias(e, f);
    }
  },

  'marcar-aviso-emitido': (fruicaoId) => {
    const f = DB.vacations.find(x => String(x.id) === String(fruicaoId));
    f.avisoEmitido = 'Sim';
    saveDB(); render();
  },
  'anexar-aviso': (fruicaoId) => {
    const f = DB.vacations.find(x => String(x.id) === String(fruicaoId));
    openModal('Anexar Aviso de Férias assinado', `
      ${docStorageNote()}
      ${field('Arquivo assinado', 'arquivo', 'file', { required: true, accept: '.pdf,.jpg,.jpeg,.png' })}
      ${controlesSalvarCopia()}
    `, (data) => {
      f.avisoAnexoNome = data.arquivo.name;
      f.avisoAnexoData = L.fmtDate(REF);
      f.avisoEmitido = 'Sim';
    });
  },
  'anexar-recibo': (fruicaoId) => {
    const f = DB.vacations.find(x => String(x.id) === String(fruicaoId));
    openModal('Anexar Recibo de Férias assinado', `
      ${docStorageNote()}
      ${field('Arquivo assinado', 'arquivo', 'file', { required: true, accept: '.pdf,.jpg,.jpeg,.png' })}
      ${controlesSalvarCopia()}
    `, (data) => {
      f.reciboAnexoNome = data.arquivo.name;
      f.reciboAnexoData = L.fmtDate(REF);
    });
  },

  'novo-payroll': () => {
    const options = DB.employees.filter(e => e.status === 'Ativo').map(e => ({ v: e.id, l: `${e.id} — ${e.nome}` }));
    openModal('Fechar lançamento de folha (gerencial)', `
      ${field('Colaborador', 'employeeId', 'select', { required: true, options })}
      ${field('Competência (1º dia do mês)', 'competencia', 'date', { required: true })}
      ${field('Data de pagamento', 'dataPagamento', 'date', {})}
      ${field('Ajuda de custo (R$)', 'ajudaCusto', 'number', { step: '0.01', value: 0 })}
      ${field('Vale Transporte (R$)', 'vt', 'number', { step: '0.01', value: 0 })}
      ${field('Outros descontos (R$)', 'outrosDescontos', 'number', { step: '0.01', value: 0 })}
      ${field('Status', 'status', 'select', { required: true, options: [{ v: 'Pendente', l: 'Pendente' }, { v: 'Pago', l: 'Pago' }, { v: 'Cancelado', l: 'Cancelado' }] })}
    `, (data) => {
      const employeeId = Number(data.employeeId);
      const competencia = String(data.competencia || '');
      if (!/^\d{4}-(0[1-9]|1[0-2])-01$/.test(competencia)) {
        alert('Informe a competência no primeiro dia do mês (ex.: 2026-01-01).');
        return false;
      }
      // Detecta também registros antigos em dias diferentes do mesmo mês, sem alterar a base migrada.
      const dup = DB.payroll.find(p => Number(p.employeeId) === employeeId && String(p.competencia || '').slice(0, 7) === competencia.slice(0, 7));
      if (dup) { alert('Já existe um lançamento para este colaborador neste mês. Confira os registros de folha antes de continuar.'); return false; }
      DB.payroll.push({ id: nextId('payroll'), employeeId, ajudaCusto: Number(data.ajudaCusto) || 0, auxCombustivel: 0, outrosDescontos: Number(data.outrosDescontos) || 0, vt: Number(data.vt) || 0, competencia: data.competencia, dataPagamento: data.dataPagamento || null, status: data.status });
    });
  },

  'novo-pagamento-pj': (id) => {
    const c = DB.contractors.find(x => String(x.id) === String(id));
    if (!c) { alert('Prestador PJ não encontrado.'); return; }
    const tabela = L.COMMISSION_TIERS.slice(1).map((t, i, tiers) => {
      const limiteSuperior = tiers[i + 1] ? tiers[i + 1].min - 0.01 : Infinity;
      return `<tr><td class="mono">${L.fmtBRL(t.min)} ${Number.isFinite(limiteSuperior) ? 'a ' + L.fmtBRL(limiteSuperior) : 'em diante'}</td><td class="mono">${(t.pct * 100).toFixed(1)}%</td></tr>`;
    }).join('');
    openModal(`Lançar pagamento PJ — ${c.nome || c.razaoSocial}`, `
      ${field('Competência', 'competencia', 'date', { required: true })}
      ${field('Data deste pagamento', 'dataPagamento', 'date', {})}
      ${field('Valor bruto de vendas do mês (R$)', 'valorVendas', 'number', { required: true, step: '0.01', value: 0 })}
      ${field('Comissão total devida (R$)', 'comissaoDevida', 'number', { required: true, min: 0, step: '0.01', value: 0 })}
      ${field('Valor de comissão a pagar agora (R$)', 'comissaoPagaAgora', 'number', { required: true, min: 0, step: '0.01', value: 0 })}
      ${field('Desconto (R$)', 'desconto', 'number', { min: 0, step: '0.01', value: 0 })}
      ${field('Nota Fiscal', 'notaFiscal', 'select', { required: true, options: [{ v: 'Não Emitida', l: 'Não Emitida' }, { v: 'Emitida', l: 'Emitida' }] })}
      <div id="preview-comissao" class="panel" style="background:var(--surface-2); padding:10px 12px; font-size:12.5px;">
        <div><strong>Valor fixo mensal:</strong> <span class="mono">${L.fmtBRL(c.valorFixoMensal || 0)}</span></div>
        <div><strong>Comissão total devida:</strong> <span id="pv-devida" class="mono">R$ 0,00</span></div>
        <div><strong>Comissão paga anteriormente:</strong> <span id="pv-paga-anterior" class="mono">R$ 0,00</span></div>
        <div><strong>Total de comissão pago após este lançamento:</strong> <span id="pv-pago" class="mono">R$ 0,00</span></div>
        <div><strong>Saldo de comissão pendente:</strong> <span id="pv-saldo" class="mono">R$ 0,00</span></div>
        <div><strong>Total a pagar agora (fixo + comissão − desconto):</strong> <span id="pv-total" class="mono">${L.fmtBRL(c.valorFixoMensal || 0)}</span></div>
      </div>
      <details><summary class="muted" style="cursor:pointer; font-size:12px;">Ver tabela de referência das faixas de comissão</summary>
        <p class="muted" style="font-size:12px;">As faixas são apenas referência. Informe manualmente a comissão total devida.</p>
        <div class="table-wrap" style="margin-top:8px;"><table class="table"><thead><tr><th>Faixa de vendas no mês</th><th>% de referência</th></tr></thead><tbody>${tabela}</tbody></table></div>
      </details>
    `, (data) => {
      const competencia = data.competencia;
      const vendas = Number(data.valorVendas);
      const devida = Number(data.comissaoDevida);
      const pagaAgora = Number(data.comissaoPagaAgora);
      const desconto = Number(data.desconto) || 0;
      if (!competencia) { alert('Informe a competência.'); return false; }
      if (![vendas, devida, pagaAgora, desconto].every(Number.isFinite) || vendas < 0 || devida < 0 || pagaAgora < 0 || desconto < 0) {
        alert('Informe valores válidos e não negativos.'); return false;
      }
      const existente = DB.pjPayments.find(p => Number(p.contractorId) === Number(id) && p.dataCompetencia === competencia);
      const jaPago = existente ? (Number(existente.comissaoPaga ?? (existente.status === 'PAGO' ? (existente.comissaoDevida ?? L.calcComissaoPJ(existente.valorVendas).valor) : 0)) || 0) : 0;
      if (jaPago + pagaAgora > devida + 0.001) {
        alert(`O pagamento total de comissão (${L.fmtBRL(jaPago + pagaAgora)}) não pode ultrapassar a comissão devida (${L.fmtBRL(devida)}).`); return false;
      }
      if (pagaAgora > 0 && data.notaFiscal !== 'Emitida') {
        alert('Emita a Nota Fiscal antes de registrar pagamento de comissão.'); return false;
      }
      const pagaAcumulada = Math.round((jaPago + pagaAgora) * 100) / 100;
      const saldo = Math.max(0, Math.round((devida - pagaAcumulada) * 100) / 100);
      const status = saldo <= 0 ? 'PAGO' : 'PENDENTE';
      const dados = { contractorId: Number(id), valorVendas: vendas, comissaoDevida: devida, comissaoPaga: pagaAcumulada, desconto, notaFiscal: data.notaFiscal, dataCompetencia: competencia, dataPagamento: data.dataPagamento || (existente && existente.dataPagamento) || null, status, observacoes: existente ? existente.observacoes : null };
      if (existente) Object.assign(existente, dados);
      else DB.pjPayments.push({ id: nextId('pjPayments'), ...dados });
    });
    setTimeout(() => {
      const form = document.getElementById('modal-form');
      if (!form) return;
      const get = name => form.querySelector(`[name="${name}"]`);
      const competenciaInput = get('competencia');
      const vendasInput = get('valorVendas');
      const devidaInput = get('comissaoDevida');
      const pagaInput = get('comissaoPagaAgora');
      const descontoInput = get('desconto');
      const atualizar = () => {
        const anterior = competenciaInput.value ? DB.pjPayments.find(p => Number(p.contractorId) === Number(id) && p.dataCompetencia === competenciaInput.value) : null;
        const jaPago = anterior ? (Number(anterior.comissaoPaga ?? (anterior.status === 'PAGO' ? (anterior.comissaoDevida ?? L.calcComissaoPJ(anterior.valorVendas).valor) : 0)) || 0) : 0;
        const devida = Number(devidaInput.value) || 0;
        const pagaAgora = Number(pagaInput.value) || 0;
        const pagaAcumulada = jaPago + pagaAgora;
        const saldo = Math.max(0, devida - pagaAcumulada);
        const desconto = Number(descontoInput.value) || 0;
        const bruto = Number(vendasInput.value) || 0;
        const pct = L.calcComissaoPJ(bruto).pct;
        document.getElementById('pv-devida').textContent = L.fmtBRL(devida);
        document.getElementById('pv-paga-anterior').textContent = L.fmtBRL(jaPago);
        document.getElementById('pv-pago').textContent = L.fmtBRL(pagaAcumulada);
        document.getElementById('pv-saldo').textContent = L.fmtBRL(saldo);
        document.getElementById('pv-total').textContent = L.fmtBRL((c.valorFixoMensal || 0) + pagaAgora - desconto);
        const labelPct = document.getElementById('pv-faixa');
        if (labelPct) labelPct.textContent = (pct * 100).toFixed(1) + '% (referência)';
      };
      [competenciaInput, vendasInput, devidaInput, pagaInput, descontoInput].forEach(input => input && input.addEventListener('input', atualizar));
      atualizar();
    }, 0);
  },
};


</script>
<script>

/* ===================== STORE ===================== */
const STORAGE_KEY = 'rh_sistema_v2_planilha_2026';
const BASE_VERSION = 'planilha_rh_2026_10_com_he_20261031_gestores_v2';
let DB = null;
let NEXT_ID = { salaryHistory: 1000, exams: 1000, vacations: 1000, payroll: 1000, pjPayments: 1000 };

const DEFAULT_DOCUMENT_TYPES = [
  { id: 1, nome: 'RG/CPF ou CNH', grupo: 'Pessoal', regra: 'Padrão' },
  { id: 2, nome: 'Certidão de nascimento/casamento', grupo: 'Pessoal', regra: 'Conforme situação' },
  { id: 3, nome: 'Título de eleitor', grupo: 'Pessoal', regra: 'Configurável' },
  { id: 4, nome: 'Carteira de Trabalho', grupo: 'Pessoal', regra: 'Cadastro' },
  { id: 5, nome: 'PIS/NIT', grupo: 'Pessoal', regra: 'Se possuir/aplicável' },
  { id: 6, nome: 'Reservista', grupo: 'Pessoal', regra: 'Condicional' },
  { id: 7, nome: 'Comprovante de endereço', grupo: 'Pessoal', regra: 'Padrão' },
  { id: 8, nome: 'Escolaridade', grupo: 'Pessoal', regra: 'Padrão' },
  { id: 9, nome: 'Foto 3x4', grupo: 'Pessoal', regra: 'Controle físico' },
  { id: 10, nome: 'E-mail', grupo: 'Pessoal', regra: 'Cadastro' },
  { id: 11, nome: 'Dados bancários', grupo: 'Complementar', regra: 'Padrão' },
  { id: 12, nome: 'PIX', grupo: 'Complementar', regra: 'Padrão' },
  { id: 13, nome: 'Certidão dos filhos', grupo: 'Complementar', regra: 'Se houver dependente' },
  { id: 14, nome: 'Vacinação', grupo: 'Complementar', regra: 'Conforme aplicabilidade' },
  { id: 15, nome: 'Matrícula escolar', grupo: 'Complementar', regra: 'Conforme aplicabilidade' },
  { id: 16, nome: 'CPF dos filhos', grupo: 'Complementar', regra: 'Se houver dependente' },
  { id: 17, nome: 'ASO admissional', grupo: 'Admissional p/ assinatura', regra: 'Documento' },
  { id: 18, nome: 'Contrato de experiência', grupo: 'Admissional p/ assinatura', regra: 'Assinatura' },
  { id: 19, nome: 'Ficha de registro', grupo: 'Admissional p/ assinatura', regra: 'Assinatura' },
  { id: 20, nome: 'Termo de sigilo da informação', grupo: 'Admissional p/ assinatura', regra: 'Assinatura' },
  { id: 21, nome: 'Responsabilidade e confidencialidade – LGPD', grupo: 'Admissional p/ assinatura', regra: 'Assinatura' },
  { id: 22, nome: 'Autorização de desconto', grupo: 'Admissional p/ assinatura', regra: 'Assinatura' },
  { id: 23, nome: 'Regimento interno', grupo: 'Admissional p/ assinatura', regra: 'Ciência' },
  { id: 24, nome: 'Vale-transporte', grupo: 'Admissional p/ assinatura', regra: 'Opção/assinatura' },
];
const ADMISSION_STAGES = ['Pré-admissão', 'Documentos pendentes', 'Documentos em análise', 'Liberado para ASO', 'ASO agendado', 'ASO apto', 'Enviado à contabilidade', 'Documentos para assinatura', 'Integração em andamento', 'Treinamentos SST pendentes', 'Liberado para início', 'Ativo'];
const OFFBOARDING_TASKS = ['Comunicar contabilidade', 'Fechar ponto', 'Levantar banco de horas', 'Verificar férias', 'Cancelar benefícios', 'Agendar exame demissional (quando aplicável)', 'Receber equipamentos', 'Bloquear acessos', 'Receber documentos rescisórios', 'Assinaturas', 'Registrar pagamento', 'Entrevista de desligamento'];
const TIPOS_DESLIGAMENTO = ['Dispensa sem justa causa — aviso indenizado', 'Dispensa sem justa causa — aviso trabalhado', 'Pedido de demissão', 'Término normal do contrato de experiência', 'Encerramento antecipado do contrato de experiência'];

function loadDB() {
  try {
    // Descarta dados locais da versão anterior para aplicar a planilha atualizada.
    if (localStorage.getItem('rh_sistema_base_version') !== BASE_VERSION) {
      localStorage.removeItem('rh_sistema_v1');
      localStorage.removeItem(STORAGE_KEY);
      localStorage.setItem('rh_sistema_base_version', BASE_VERSION);
    }
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { DB = JSON.parse(raw); backfillCollections(); return; }
  } catch (e) { /* armazenamento pode estar indisponível: usa a base incorporada */ }
  DB = JSON.parse(JSON.stringify(RAW_DATA));
  backfillCollections();
}
function backfillCollections() {
  // Novas coleções da diretriz V2 — nascem vazias (sem dado de origem na planilha), exceto catálogos explicitamente informados pela diretriz.
  DB.companies = DB.companies || [{ id: 1, nome: 'Toppia' }, { id: 2, nome: 'Trevo' }];
  DB.documentTypes = DB.documentTypes || JSON.parse(JSON.stringify(DEFAULT_DOCUMENT_TYPES));
  DB.documents = DB.documents || [];
  DB.admissions = DB.admissions || [];
  DB.movements = DB.movements || [];
  DB.feedbacks = DB.feedbacks || [];
  DB.leaves = DB.leaves || [];
  DB.timeBank = DB.timeBank || [];
  DB.offboardings = DB.offboardings || [];
  DB.rescisoes = DB.rescisoes || [];
  DB.trainingCatalog = DB.trainingCatalog || [];
  DB.sstMatrix = DB.sstMatrix || [];
  DB.employees.forEach(e => { if (e.empresa === undefined) e.empresa = null; if (e.estabelecimento === undefined) e.estabelecimento = null; if (e.statusWorkflow === undefined) e.statusWorkflow = (e.status === 'Ativo' ? 'Ativo' : (e.status === 'Inativo' ? 'Desligado' : e.status)); });

  // Férias: migra registros antigos (da planilha) para o novo modelo de fruição por período aquisitivo.
  DB.vacations.forEach(v => {
    if (v.aquisitivoInicio !== undefined) return; // já migrado
    const emp = DB.employees.find(e => e.id === v.employeeId);
    const refCiclo = v.inicioFerias ? L.toDate(v.inicioFerias) : REF;
    const ciclo = emp ? L.cicloAquisitivo(emp.dataAdmissao, refCiclo) : null;
    v.aquisitivoInicio = ciclo ? ciclo.aquisitivoInicio : null;
    v.aquisitivoFim = ciclo ? ciclo.aquisitivoFim : null;
    v.concessivoLimite = ciclo ? ciclo.concessivoLimite : null;
    v.diasAbono = v.diasAbono || 0;
    v.diasGozo = Math.max(0, (v.qtdDiasBase || 30) - v.diasAbono);
    v.formaUtilizacao = v.diasAbono ? '20-abono' : 'legado';
    v.statusFruicao = v.inicioFerias ? 'Confirmado' : 'Pendente';
    v.avisoEmitido = v.avisoEmitido || 'Não';
    v.avisoAnexoNome = v.avisoAssinado === 'Sim' ? 'aviso-legado.pdf' : null;
    v.avisoAnexoData = null;
    v.reciboAnexoNome = v.reciboAssinado === 'Sim' ? 'recibo-legado.pdf' : null;
    v.reciboAnexoData = null;
  });
  if (typeof reconciliarFerias === 'function') reconciliarFerias();
}
// Uma gravação com erro NÃO é confirmação de salvamento. Os dados continuam em memória
// nesta aba até que o usuário tente novamente; fechar ou recarregar pode perdê-los.
let UNSAVED_CHANGES = false;
function showSaveWarning() {
  if (typeof document === 'undefined' || !document.body) return;
  let warning = document.getElementById('save-warning');
  if (warning) return;
  warning = document.createElement('div');
  warning.id = 'save-warning';
  warning.setAttribute('role', 'alert');
  warning.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:100;background:#FFF3C4;color:#242012;border:2px solid #A17F00;border-radius:8px;padding:12px 16px;box-shadow:0 8px 30px rgba(0,0,0,.35);font:14px/1.5 sans-serif;';
  warning.innerHTML = '<strong>Alterações não salvas.</strong> Os dados continuam nesta aba, mas serão perdidos se ela for fechada. Libere espaço ou permita o armazenamento no navegador e tente novamente. <button type="button" id="retry-save" style="margin-left:8px;padding:6px 10px;cursor:pointer">Tentar salvar</button>';
  document.body.appendChild(warning);
  warning.querySelector('#retry-save').addEventListener('click', () => {
    try { saveDB(); document.getElementById('modal-root').innerHTML = ''; render(); }
    catch (err) { alert('Ainda não foi possível salvar: ' + err.message); }
  });
}
function saveDB() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    UNSAVED_CHANGES = false;
    const warning = document.getElementById('save-warning');
    if (warning) warning.remove();
  } catch (e) {
    UNSAVED_CHANGES = true;
    showSaveWarning();
    throw new Error('O navegador recusou a gravação. Suas alterações estão apenas na aba aberta; não recarregue nem feche a página. Use “Tentar salvar” após liberar espaço ou habilitar o armazenamento.');
  }
}
window.addEventListener('beforeunload', (event) => {
  if (!UNSAVED_CHANGES) return;
  event.preventDefault();
  event.returnValue = '';
});
function resetDB() {
  // Remover dados locais com armazenamento bloqueado não pode parecer uma restauração bem-sucedida.
  localStorage.removeItem(STORAGE_KEY);
  UNSAVED_CHANGES = false;
  const warning = document.getElementById('save-warning');
  if (warning) warning.remove();
  loadDB();
  render();
}
function nextId(coll) {
  const arr = DB[coll];
  return (arr.length ? Math.max(...arr.map(x => x.id)) : 0) + 1;
}
function nextPersonId() {
  const ids = [...DB.employees.map(e => e.id), ...DB.contractors.map(c => c.id)];
  return (ids.length ? Math.max(...ids) : 0) + 1;
}

function renderShell() {
  const route = currentRoute();
  const allowed = ROLE_MENU[SESSION.role] || [];
  const groups = {};
  MENU_ITEMS.filter(m => allowed.includes(m.id)).forEach(m => {
    (groups[m.group] = groups[m.group] || []).push(m);
  });
  let nav = '';
  for (const g in groups) {
    nav += `<div class="nav-group"><div class="nav-group-label">${g}</div>`;
    groups[g].forEach(m => {
      nav += `<a href="#/${m.id}" class="nav-link ${route.name === m.id ? 'active' : ''}"><span class="nav-ic">${m.icon}</span>${m.label}</a>`;

      </select>
      ${SESSION.role === 'Colaborador' ? `<select id="scope-select" aria-label="Colaborador"><option value="">Selecione o colaborador…</option>${employeeOptions}</select>` : ''}
      ${SESSION.role === 'Gestor' ? `<select id="scope-select" aria-label="Gestor"><option value="">Selecione o gestor…</option>${gestorOptions().map(g => `<option value="${escapeHtml(g)}" ${normalizeGestor(g) === normalizeGestor(SESSION.scopeId) ? 'selected' : ''}>${escapeHtml(g)}</option>`).join('')}</select>` : ''}

/* ===================== RENDER PRINCIPAL ===================== */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = renderShell();
  wireShellEvents();
  const route = currentRoute();
  const allowed = ROLE_MENU[SESSION.role] || [];
  const target = allowed.includes(route.name) ? route.name : allowed[0];
  const el = document.getElementById('content');
  el.innerHTML = VIEWS[target] ? VIEWS[target](route.param) : `<div class="empty">Tela não encontrada.</div>`;
  wireViewEvents(target);
}

function wireShellEvents() {
  document.getElementById('role-select').addEventListener('change', (e) => {
    SESSION.role = e.target.value;
    SESSION.scopeId = null;
    location.hash = '#/' + (ROLE_MENU[SESSION.role][0]);
    render();
  });
  const scopeSel = document.getElementById('scope-select');
  if (scopeSel) scopeSel.addEventListener('change', (e) => { SESSION.scopeId = e.target.value; render(); });

  const search = document.getElementById('global-search');
  const results = document.getElementById('search-results');
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    if (!q) { results.classList.add('hidden'); results.innerHTML = ''; return; }
    const hits = [];
    const employeePool = SESSION.role === 'Gestor' ? visibleEmployees() : DB.employees;
    employeePool.forEach(e => {
      if ([e.nome, e.cpf, String(e.id), e.cargo, e.departamento].join(' ').toLowerCase().includes(q)) hits.push({ type: 'CLT', id: e.id, label: e.nome, sub: `${e.cargo} · ${e.departamento}` });
    });
    if (SESSION.role !== 'Gestor') DB.contractors.forEach(c => {
      if ([c.razaoSocial, c.cnpj, String(c.id), c.servico].join(' ').toLowerCase().includes(q)) hits.push({ type: 'PJ', id: c.id, label: c.razaoSocial, sub: c.servico });
    });
    results.innerHTML = hits.slice(0, 8).map(h => `<div class="search-item" data-type="${h.type}" data-id="${h.id}"><span class="badge badge-muted">${h.type}</span> <strong>${h.label}</strong><span class="muted"> — ${h.sub}</span></div>`).join('') || `<div class="search-item muted">Nenhum resultado</div>`;
    results.classList.remove('hidden');
  });
  results.addEventListener('click', (e) => {
    const item = e.target.closest('.search-item');
    if (!item || !item.dataset.id) return;
    location.hash = item.dataset.type === 'CLT' ? `#/colaboradores/${item.dataset.id}` : `#/contratados/${item.dataset.id}`;
    search.value = ''; results.classList.add('hidden');
    render();
  });
}

const FB_COMPETENCIES = [
  { key:'entrega', label:'Entrega e qualidade' },
  { key:'colaboracao', label:'Colaboração' },
  { key:'comunicacao', label:'Comunicação' },
  { key:'iniciativa', label:'Iniciativa' },
  { key:'desenvolvimento', label:'Aprendizado' }
];
function feedbackScore(f) {
  const vals = FB_COMPETENCIES.map(c => Number((f.scores || {})[c.key]));
  return vals.every(n => Number.isInteger(n) && n >= 1 && n <= 5) ? vals.reduce((a,b) => a+b, 0) / vals.length : null;
}
function feedbackDates() { return new Date().toLocaleDateString('en-CA'); }
function feedbackEmployee(id) { return visibleEmployees().find(e => String(e.id) === String(id)); }
function feedbackEntries(id) {
  return DB.feedbacks.filter(f => Number(f.employeeId) === Number(id))
    .slice().sort((a,b) => b.data.localeCompare(a.data) || b.id - a.id);
}
function feedbackOverview() {
  const employees = visibleEmployees().slice().sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  if (!employees.length) return `<div class="empty">${isGestorScoped() ? 'Selecione um gestor no topo para ver a equipe.' : 'Nenhum colaborador cadastrado.'}</div>`;
  return `<div class="fb-overview">${employees.map(e => {
    const entries = feedbackEntries(e.id), last = entries[0], score = last && feedbackScore(last);
    return `<a class="fb-person" href="#/feedbacks/${e.id}"><strong>${escapeHtml(e.nome)}</strong>
      <small>${escapeHtml(e.cargo || 'Cargo não informado')} · ${escapeHtml(e.departamento || 'Sem departamento')}</small>
      <span class="fb-person-meta"><span>${entries.length} avaliação(ões)</span><span>${score == null ? 'Sem nota' : score.toFixed(1) + ' / 5'}${last ? ` · ${L.fmtDateBR(last.data)}` : ''}</span></span></a>`;
  }).join('')}</div>`;
}
VIEWS.feedbacks = function(id) {
  const employee = id ? feedbackEmployee(id) : null;
  if (id && !employee) return `<div class="empty">Colaborador não encontrado ou fora da equipe selecionada.</div>`;
  if (!employee) return `<div class="page-head"><h1>Feedbacks</h1><p>Histórico de avaliações por competências e acompanhamento dos planos de ação.</p></div>
    <section class="panel"><h2>Colaboradores</h2><p>Selecione uma pessoa para registrar um feedback ou consultar sua evolução.</p>${feedbackOverview()}</section>`;
  const records = feedbackEntries(employee.id), chronological = records.slice().reverse();
  const firstScore = chronological.length ? feedbackScore(chronological[0]) : null;
  const lastScore = records.length ? feedbackScore(records[0]) : null;
  const delta = firstScore != null && lastScore != null && records.length > 1 ? lastScore - firstScore : null;
  const pending = records.filter(f => f.plano && f.actionStatus !== 'Concluído').length;
  const trend = chronological.map(f => {
    const score = feedbackScore(f);
    return `<div class="fb-trend-item" title="${L.fmtDateBR(f.data)}: ${score == null ? 'sem nota' : score.toFixed(1) + ' de 5'}"><strong>${score == null ? '—' : score.toFixed(1)}</strong>
      <div class="fb-trend-bar" style="height:${score == null ? 3 : Math.round(score * 16)}px"></div><time datetime="${f.data}">${L.fmtDateBR(f.data)}</time></div>`;
  }).join('');
  const history = records.map(f => {
    const score = feedbackScore(f), pendingAction = f.plano && f.actionStatus !== 'Concluído';
    const scores = FB_COMPETENCIES.map(c => {
      const n = Number((f.scores || {})[c.key]);
      return `<div class="fb-competency"><span><span>${c.label}</span><strong>${n || '—'} / 5</strong></span><div class="bar"><div class="bar-fill bar-ok" style="width:${n ? n*20 : 0}%"></div></div></div>`;
    }).join('');
    return `<div class="fb-entry"><article class="panel"><div class="fb-entry-head"><div><time class="muted" datetime="${f.data}">${L.fmtDateBR(f.data)}</time>
      <h2>${escapeHtml(f.tipo || 'Feedback periódico')}</h2><p>Responsável: ${escapeHtml(f.autor || 'Não informado')}</p></div>
      <div class="fb-score">${score == null ? '—' : score.toFixed(1)} <small>/ 5 · média das competências</small></div></div>
      <div class="fb-competencies">${scores}</div>
      <div class="fb-text-grid"><div><h3>Pontos fortes</h3><p>${escapeHtml(f.pontosFortes)}</p></div><div><h3>Oportunidades de melhoria</h3><p>${escapeHtml(f.melhorias)}</p></div></div>
      ${f.plano ? `<div class="fb-action"><h3>Plano de ação</h3><p>${escapeHtml(f.plano)}</p><div class="fb-action-footer"><span>Prazo: ${f.prazo ? L.fmtDateBR(f.prazo) : 'sem prazo'} · ${badge(f.actionStatus || 'Em andamento', pendingAction ? 'warn' : 'ok')}</span>
        ${pendingAction ? `<button class="btn" data-action="concluir-feedback" data-id="${f.id}">Concluir ação</button>` : ''}</div>
        ${f.actionUpdates && f.actionUpdates.length ? `<p class="muted" style="font-size:12px; margin:9px 0 0">${f.actionUpdates.map(u => `${L.fmtDateBR(u.data)} · ${escapeHtml(u.nota)}`).join('<br>')}</p>` : ''}</div>` : ''}
      <p class="muted" style="font-size:11px; margin-top:14px;">Registrado em ${escapeHtml(f.criadoEm || f.data)} · registro #${f.id}</p>
    </article></div>`;
  }).join('');
  return `<div class="page-head"><a href="#/feedbacks" class="breadcrumb">← Feedbacks</a>
    <div class="fb-summary"><div><h1>${escapeHtml(employee.nome)}</h1><p>${escapeHtml(employee.cargo || '')} · ${escapeHtml(employee.departamento || 'Sem departamento')} · ${records.length} avaliação(ões) registradas</p></div>

    <div class="kpi-grid">${card('Última avaliação', lastScore == null ? '—' : lastScore.toFixed(1) + ' / 5', records[0] ? L.fmtDateBR(records[0].data) : 'Ainda não avaliado')}
      ${card('Evolução desde a primeira', delta == null ? '—' : (delta >= 0 ? '+' : '') + delta.toFixed(1), records.length > 1 ? 'Pontos na média das competências' : 'É preciso registrar ao menos duas avaliações')}
      ${card('Planos em andamento', pending, 'Ações de feedback ainda não concluídas')}</div>
    ${records.length ? `<section class="panel"><h2>Evolução das avaliações</h2><p class="muted">Média simples das cinco competências, escala de 1 a 5. Compare também cada competência no histórico abaixo.</p><div class="fb-trend">${trend}</div></section>
      <h2 style="margin:22px 0 14px">Histórico de feedbacks</h2><div class="fb-history">${history}</div>` : `<section class="panel"><h2>Sem feedbacks registrados</h2><p>Registre a primeira avaliação para começar a acompanhar a evolução de ${escapeHtml(employee.nome)}.</p>
      <button class="btn btn-primary" data-action="novo-feedback" data-id="${employee.id}">Registrar primeiro feedback</button></section>`}`;
